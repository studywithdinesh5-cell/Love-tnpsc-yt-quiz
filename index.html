<!DOCTYPE html>
<html lang="ta">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>LOVE TNPSC - Studio Quiz</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link href="https://fonts.googleapis.com/css2?family=Mukta+Malar:wght@600;700;800&family=Teko:wght@700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body, html {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background: #ffffff !important;
      font-family: 'Mukta Malar', sans-serif;
      color: #0b1536;
    }

    .main-wrapper {
      width: 100%;
      height: 100%;
      background: #ffffff;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 8px 18px;
      position: relative;
    }

    /* Top Bar */
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 5px;
      border-bottom: 1.5px solid #e2e8f0;
      gap: 6px;
      flex-shrink: 0;
      z-index: 10;
      flex-wrap: wrap;
    }

    .brand-tag {
      font-weight: 800;
      font-size: 13px;
      color: #1e3a8a;
      letter-spacing: 0.5px;
      white-space: nowrap;
    }

    .grid-trigger-btn, .nav-btn, .pen-toggle-btn, .btn-edit {
      background: #f1f5f9;
      color: #0f172a;
      border: 1px solid #cbd5e1;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .pen-toggle-btn.active {
      background: #ef4444 !important;
      color: #ffffff !important;
      border-color: #dc2626 !important;
    }

    .auto-btn {
      background: linear-gradient(135deg, #059669, #047857);
      color: #ffffff;
      font-size: 12px;
      font-weight: 800;
      border: none;
      padding: 6px 14px;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(5, 150, 105, 0.3);
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .auto-btn.running {
      background: linear-gradient(135deg, #dc2626, #991b1b);
    }

    /* Question Title */
    .question-title {
      font-size: 21px;
      font-weight: 800;
      color: #0b1a78;
      line-height: 1.35;
      margin: 6px 0;
      flex-shrink: 0;
      cursor: pointer;
      z-index: 5;
    }

    /* Middle Body */
    .body-content {
      display: flex;
      flex: 1;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin: 2px 0;
      overflow: hidden;
      position: relative;
    }

    .options-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex: 1;
      max-width: 54%;
      justify-content: center;
      z-index: 5;
    }

    .opt-box {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 18px;
      font-weight: 800;
      color: #000000;
      padding: 6px 12px;
      border-radius: 6px;
      background: #ffffff;
      transition: all 0.25s ease;
    }

    .opt-char {
      color: #000000;
      font-weight: 800;
      width: 24px;
    }

    .opt-box.is-correct {
      background-color: #10b981 !important;
      color: #ffffff !important;
      box-shadow: 0 3px 10px rgba(16, 185, 129, 0.4);
    }
    .opt-box.is-correct span {
      color: #ffffff !important;
    }

    .tick-badge {
      margin-left: auto;
      background: #ffffff;
      color: #059669;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 900;
      animation: popTick 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    @keyframes popTick {
      0% { transform: scale(0); }
      100% { transform: scale(1); }
    }

    .free-writing-space {
      flex: 1;
      height: 100%;
      position: relative;
    }

    .status-pill {
      position: absolute;
      top: 4px;
      right: 4px;
      background: #eff6ff;
      color: #1e40af;
      font-size: 11px;
      font-weight: 800;
      padding: 4px 12px;
      border-radius: 20px;
      border: 1px solid #bfdbfe;
      display: none;
      max-width: 190px;
      text-align: center;
    }

    .gold-timer {
      position: absolute;
      bottom: 2px;
      right: 2px;
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #fef08a, #ca8a04 60%, #713f12 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 3px 10px rgba(161, 98, 7, 0.4);
      border: 2px solid #fef9c3;
      z-index: 10;
    }

    .timer-num {
      font-family: 'Teko', sans-serif;
      font-size: 34px;
      font-weight: 700;
      color: #ffffff;
      line-height: 1;
      text-shadow: 0 2px 4px rgba(0,0,0,0.5);
    }

    /* Drawing Layer */
    #drawingCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 15;
      pointer-events: none;
      touch-action: none;
    }
    #drawingCanvas.pen-active {
      pointer-events: auto;
      cursor: crosshair;
    }

    /* Pen Toolbar */
    .pen-palette {
      display: none;
      position: absolute;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      background: #0f172a;
      padding: 5px 14px;
      border-radius: 30px;
      align-items: center;
      gap: 10px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.25);
      z-index: 25;
    }

    .color-dot {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      cursor: pointer;
      border: 2px solid #ffffff;
    }
    .color-dot.selected {
      transform: scale(1.25);
      border-color: #facc15;
    }

    .pen-action-btn {
      background: rgba(255,255,255,0.2);
      color: #ffffff;
      border: none;
      padding: 4px 8px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 800;
      cursor: pointer;
    }

    /* Comment Banner */
    .comment-banner {
      display: none;
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, 0.94);
      backdrop-filter: blur(4px);
      border-radius: 14px;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 12px;
      z-index: 20;
      padding: 16px;
      text-align: center;
    }

    .comment-text-main {
      font-size: 24px;
      font-weight: 800;
      color: #facc15;
    }

    .comment-text-sub {
      font-size: 16px;
      font-weight: 700;
      color: #ffffff;
    }

    /* Modals */
    .grid-modal, .modal-wrap {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.7);
      backdrop-filter: blur(4px);
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 12px;
    }
    .grid-content, .modal-card {
      background: #ffffff;
      border-radius: 14px;
      padding: 16px;
      width: 100%;
      max-width: 550px;
      max-height: 85vh;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .tiles-wrapper {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(44px, 1fr));
      gap: 8px;
      overflow-y: auto;
      max-height: 60vh;
      padding: 4px;
    }
    .tile-btn {
      background: #f1f5f9;
      color: #0f172a;
      border: 1.5px solid #cbd5e1;
      padding: 8px 0;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
    }
    .tile-btn.current {
      background: #1e3a8a;
      color: #ffffff;
      border-color: #1e3a8a;
    }
    .modal-card textarea {
      width: 100%;
      height: 160px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      padding: 8px;
      font-size: 12px;
      font-family: monospace;
    }
  </style>
</head>
<body>

  <div class="main-wrapper">

    <!-- Header Bar -->
    <div class="header-bar">
      <div style="display: flex; align-items: center; gap: 6px;">
        <span class="brand-tag">LOVE TNPSC</span>
        <button id="gridBtn" class="grid-trigger-btn" onclick="openGridModal()">
          <span>🔢 வினா</span>
          <span id="qBadgeNum">01/50</span>
          <span>▼</span>
        </button>
      </div>

      <div style="display: flex; align-items: center; gap: 5px;">
        <button class="nav-btn" onclick="manualPrev()">◀ பின்</button>
        <button class="nav-btn" onclick="manualNext()">முன் ▶</button>

        <button id="penToggleBtn" class="pen-toggle-btn" onclick="togglePenMode()">
          <span>✏️</span>
          <span id="penBtnText">எழுது</span>
        </button>
      </div>
      
      <button id="autoPlayBtn" class="auto-btn" onclick="toggleAutoQuiz()">
        <span id="autoIcon">▶️</span>
        <span id="autoText">Auto Play</span>
      </button>

      <button class="btn-edit" onclick="openEditor()">➕ கேள்விகள்</button>
    </div>

    <!-- Question Line -->
    <h1 id="qText" class="question-title" onclick="openGridModal()"></h1>

    <!-- Body -->
    <div class="body-content">
      <div class="options-group">
        <div id="optRow0" class="opt-box">
          <span class="opt-char">a)</span>
          <span id="optText0"></span>
          <div id="tick0"></div>
        </div>
        <div id="optRow1" class="opt-box">
          <span class="opt-char">b)</span>
          <span id="optText1"></span>
          <div id="tick1"></div>
        </div>
        <div id="optRow2" class="opt-box">
          <span class="opt-char">c)</span>
          <span id="optText2"></span>
          <div id="tick2"></div>
        </div>
        <div id="optRow3" class="opt-box">
          <span class="opt-char">d)</span>
          <span id="optText3"></span>
          <div id="tick3"></div>
        </div>
      </div>

      <div class="free-writing-space">
        <div id="statusPill" class="status-pill">கேள்வி வாசிக்கிறது...</div>
        <div class="gold-timer">
          <span id="timerVal" class="timer-num">5</span>
        </div>
      </div>

      <div id="commentBanner" class="comment-banner">
        <div style="font-size: 38px;">💬</div>
        <div class="comment-text-main">இதற்கான சரியான விடை என்ன?</div>
        <div class="comment-text-sub">உங்க பதிலை உடனே கீழே Comment பண்ணுங்க! 👇</div>
      </div>
    </div>

    <!-- Drawing Canvas -->
    <canvas id="drawingCanvas"></canvas>

    <!-- Pen Toolbar -->
    <div id="penPalette" class="pen-palette" style="display: none;">
      <div class="color-dot selected" style="background: #ef4444;" onclick="setPenColor('#ef4444', this)"></div>
      <div class="color-dot" style="background: #eab308;" onclick="setPenColor('#eab308', this)"></div>
      <div class="color-dot" style="background: #10b981;" onclick="setPenColor('#10b981', this)"></div>
      <div class="color-dot" style="background: #2563eb;" onclick="setPenColor('#2563eb', this)"></div>
      <button class="pen-action-btn" onclick="clearCanvas()">🗑️ அழி</button>
      <button class="pen-action-btn" style="background: #ef4444;" onclick="togglePenMode()">✕ மூடு</button>
    </div>

  </div>

  <!-- Grid Modal -->
  <div id="gridModal" class="grid-modal" onclick="closeGridModal(event)">
    <div class="grid-content" onclick="event.stopPropagation()">
      <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #e2e8f0; padding-bottom: 6px;">
        <h3 style="font-size: 15px; font-weight: 800; color: #0b1a78;">வினா எண்ணைத் தேர்ந்தெடுக்கவும்:</h3>
        <button style="border: none; background: none; font-size: 18px; font-weight: bold; cursor: pointer;" onclick="closeGridModal()">✕</button>
      </div>
      <div id="tilesContainer" class="tiles-wrapper"></div>
    </div>
  </div>

  <!-- Upload Modal -->
  <div id="editorModal" class="modal-wrap">
    <div class="modal-card">
      <h3 style="font-size: 15px; font-weight: 800; color: #0b1a78;">JSON குறியீட்டை ஒட்டவும்:</h3>
      <textarea id="jsonBox"></textarea>
      <div style="display: flex; gap: 8px; justify-content: flex-end;">
        <button style="padding: 6px 14px; border: none; background: #e2e8f0; border-radius: 6px; font-weight: 700; cursor: pointer;" onclick="closeEditor()">ரத்து</button>
        <button style="padding: 6px 14px; border: none; background: #10b981; color: #fff; border-radius: 6px; font-weight: 700; cursor: pointer;" onclick="saveQuestions()">சேமி & இயக்கு</button>
      </div>
    </div>
  </div>

  <script>
    let defaultQuizData = [
      {"question": "Q) 'அரை' - 'அறை' என்ற சொற்களின் சரியான பொருள் வேறுபாட்டைத் தேர்க:", "options": ["சமையலறை - ஆடை", "பாதி - அறைதல் / அறை", "ஒலித்தல் - பாதி", "உடை - சுத்தியல்"], "correct": 1},
      {"question": "Q) 'இரை' - 'இறை' என்ற மயங்கொலிச் சொற்களின் முறையான பொருள் யாது?", "options": ["உணவு - கடவுள் / அரசன்", "சத்தம் - இறைத்தல்", "அரசன் - உணவு", "விதைத்தல் - இரைச்சல்"], "correct": 0},
      {"question": "Q) 'கூரை' - 'கூறை' பொருள் வேறுபாட்டைக் கண்டறிக:", "options": ["புடவை - வீட்டின் உச்சி", "வெட்டுதல் - உடை", "வீட்டின் கூரை - புடவை", "கூர்மையானது - ஆடை"], "correct": 2}
    ];

    let quizData = JSON.parse(localStorage.getItem('quizData_saved')) || defaultQuizData;
    let currentIndex = parseInt(localStorage.getItem('quiz_last_index')) || 0;
    if (currentIndex >= quizData.length) currentIndex = 0;

    let isAutoRunning = false;
    let countdown = 5;
    let timerHandle = null;
    let nextStepTimeout = null;
    let speechQueue = [];
    let isSpeakingNow = false;

    // Web Audio Unlock for iOS Safari
    let audioCtx = null;
    function getCtx() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      return audioCtx;
    }

    function formatForSpeech(rawText) {
      return rawText
        .replace(/^Q\)\s*/i, '')
        .replace(/['‘’"“”]/g, '')
        .replace(/\s*-\s*/g, ', ')
        .replace(/\s*\/\s*/g, ' அல்லது ')
        .replace(/_{2,}/g, ' என்ன ')
        .trim();
    }

    function stopAllSpeech() {
      isSpeakingNow = false;
      speechQueue = [];
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
      }
    }

    function getBestTamilVoice() {
      if (!('speechSynthesis' in window)) return null;
      const voices = window.speechSynthesis.getVoices();
      return (
        voices.find(v => v.lang && v.lang.toLowerCase().includes('ta') && /enhanced|premium|vani|lekha|valluvar|natural|google/i.test(v.name)) ||
        voices.find(v => v.lang && v.lang.toLowerCase().includes('ta')) ||
        voices[0]
      );
    }

    // நம்பகமான Native Speech Engine (எந்த தடையுமின்றி தொடர்ச்சியாகப் பேசும்)
    function speakText(text, onDone) {
      if (!('speechSynthesis' in window)) {
        if (onDone) onDone();
        return;
      }

      const cleaned = formatForSpeech(text);
      const utter = new SpeechSynthesisUtterance(cleaned);
      const voice = getBestTamilVoice();
      if (voice) utter.voice = voice;
      utter.lang = 'ta-IN';
      utter.rate = 0.90;   // நிதானமான தெளிவான வேகம்
      utter.pitch = 1.02;  // இயல்பான சுருதி

      let doneCalled = false;
      function finish() {
        if (doneCalled) return;
        doneCalled = true;
        if (onDone) onDone();
      }

      utter.onend = () => {
        setTimeout(finish, 200);
      };

      utter.onerror = () => {
        finish();
      };

      // Safari Safety Timeout
      const safetyTime = Math.max(3000, cleaned.length * 150);
      setTimeout(() => {
        if (!doneCalled) finish();
      }, safetyTime);

      window.speechSynthesis.speak(utter);
    }

    /* Sound Effects */
    function playTick() {
      try {
        const ctx = getCtx();
        const now = ctx.currentTime;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(850, now);
        osc.frequency.exponentialRampToValueAtTime(150, now + 0.04);
        gain.gain.setValueAtTime(0.35, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.04);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + 0.04);
      } catch (e) {}
    }

    function playDing() {
      try {
        const ctx = getCtx();
        const now = ctx.currentTime;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(880, now);
        osc.frequency.exponentialRampToValueAtTime(1046, now + 0.08);
        gain.gain.setValueAtTime(0.08, now);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.4);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + 0.4);
      } catch (e) {}
    }

    function updateStatusPill(msg, show = true) {
      const pill = document.getElementById('statusPill');
      if (!show) {
        pill.style.display = 'none';
        return;
      }
      pill.textContent = msg;
      pill.style.display = 'block';
    }

    function renderScreen() {
      clearInterval(timerHandle);
      clearTimeout(nextStepTimeout);
      stopAllSpeech();

      countdown = 5;
      localStorage.setItem('quiz_last_index', currentIndex);

      const q = quizData[currentIndex];
      document.getElementById('qBadgeNum').textContent = `${String(currentIndex + 1).padStart(2, '0')}/${String(quizData.length).padStart(2, '0')}`;
      document.getElementById('qText').textContent = q.question;
      document.getElementById('timerVal').textContent = '5';
      document.getElementById('commentBanner').style.display = 'none';
      updateStatusPill('', false);

      for (let i = 0; i < 4; i++) {
        document.getElementById(`optText${i}`).textContent = q.options[i];
        document.getElementById(`optRow${i}`).className = 'opt-box';
        document.getElementById(`tick${i}`).innerHTML = '';
      }

      clearCanvas();
    }

    function toggleAutoQuiz() {
      getCtx();
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        // iOS Audio Unlock Dummy Utterance
        window.speechSynthesis.speak(new SpeechSynthesisUtterance(''));
      }

      if (isAutoRunning) {
        stopAutoQuiz();
      } else {
        isAutoRunning = true;
        const btn = document.getElementById('autoPlayBtn');
        btn.classList.add('running');
        document.getElementById('autoIcon').textContent = '⏹️';
        document.getElementById('autoText').textContent = 'Stop';
        runCurrentQuestionCycle();
      }
    }

    function stopAutoQuiz() {
      isAutoRunning = false;
      clearInterval(timerHandle);
      clearTimeout(nextStepTimeout);
      stopAllSpeech();

      const btn = document.getElementById('autoPlayBtn');
      btn.classList.remove('running');
      document.getElementById('autoIcon').textContent = '▶️';
      document.getElementById('autoText').textContent = 'Auto Play';
      updateStatusPill('', false);
    }

    function runCurrentQuestionCycle() {
      if (!isAutoRunning) return;
      renderScreen();

      const q = quizData[currentIndex];
      updateStatusPill('🎙️ கேள்வி வாசிக்கிறது...', true);

      // 1. கேள்வியை மட்டும் வாசித்தல்
      speakText(q.question, () => {
        if (!isAutoRunning) return;
        // 2. 5 விநாடி டைமர் தொடங்குதல்
        startAutomatic5SecTimer();
      });
    }

    function startAutomatic5SecTimer() {
      if (!isAutoRunning) return;
      countdown = 5;
      updateStatusPill('⏱️ 5 விநாடி நேரம்...', true);
      playTick();
      document.getElementById('timerVal').textContent = countdown;

      timerHandle = setInterval(() => {
        if (!isAutoRunning) {
          clearInterval(timerHandle);
          return;
        }
        countdown--;
        if (countdown > 0) {
          playTick();
          document.getElementById('timerVal').textContent = countdown;
        } else {
          clearInterval(timerHandle);
          document.getElementById('timerVal').textContent = '0';
          revealAndSpeakAnswer();
        }
      }, 1000);
    }

    function revealAndSpeakAnswer() {
      if (!isAutoRunning) return;
      playDing();

      const q = quizData[currentIndex];
      const isLastQuestion = (currentIndex === quizData.length - 1);

      if (isLastQuestion) {
        document.getElementById('commentBanner').style.display = 'flex';
        updateStatusPill('💬 கமெண்ட் பண்ணுங்க!', true);
        speakText('இதற்கான சரியான விடை என்ன? உங்கள் பதிலை கீழே கமெண்ட் பண்ணுங்க!', () => {
          stopAutoQuiz();
        });
        return;
      }

      const correctIdx = q.correct;
      const row = document.getElementById(`optRow${correctIdx}`);
      row.classList.add('is-correct');
      document.getElementById(`tick${correctIdx}`).innerHTML = '<span class="tick-badge">✔</span>';

      const correctAnswerText = q.options[correctIdx];
      updateStatusPill('✔ விடை வாசிக்கிறது...', true);

      // 3. விடையை மட்டும் வாசித்தல்
      speakText(`சரியான விடை, ${correctAnswerText}`, () => {
        if (!isAutoRunning) return;
        // 4. தானாக அடுத்த கேள்விக்குச் செல்லுதல்
        nextStepTimeout = setTimeout(() => {
          if (!isAutoRunning) return;
          if (currentIndex < quizData.length - 1) {
            currentIndex++;
            runCurrentQuestionCycle();
          } else {
            stopAutoQuiz();
          }
        }, 1600);
      });
    }

    function manualNext() {
      if (currentIndex < quizData.length - 1) {
        currentIndex++;
        if (isAutoRunning) runCurrentQuestionCycle();
        else renderScreen();
      }
    }

    function manualPrev() {
      if (currentIndex > 0) {
        currentIndex--;
        if (isAutoRunning) runCurrentQuestionCycle();
        else renderScreen();
      }
    }

    /* Pen Engine */
    const canvas = document.getElementById('drawingCanvas');
    const ctx = canvas.getContext('2d');
    let isDrawing = false;
    let penActive = false;
    let penColor = '#ef4444';
    let penSize = 3.5;

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);

    function togglePenMode() {
      penActive = !penActive;
      const penBtn = document.getElementById('penToggleBtn');
      const penText = document.getElementById('penBtnText');
      const palette = document.getElementById('penPalette');

      if (penActive) {
        canvas.classList.add('pen-active');
        penBtn.classList.add('active');
        penText.textContent = 'எழுதுகிறது...';
        palette.style.display = 'flex';
      } else {
        canvas.classList.remove('pen-active');
        penBtn.classList.remove('active');
        penText.textContent = 'எழுது';
        palette.style.display = 'none';
      }
    }

    function setPenColor(color, el) {
      penColor = color;
      document.querySelectorAll('.color-dot').forEach(d => d.classList.remove('selected'));
      el.classList.add('selected');
    }

    function clearCanvas() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
    }

    function getPos(e) {
      return {
        x: e.clientX || (e.touches && e.touches[0].clientX),
        y: e.clientY || (e.touches && e.touches[0].clientY)
      };
    }

    function startDraw(e) {
      if (!penActive) return;
      isDrawing = true;
      const pos = getPos(e);
      ctx.beginPath();
      ctx.moveTo(pos.x, pos.y);
      ctx.strokeStyle = penColor;
      ctx.lineWidth = penSize;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
    }

    function draw(e) {
      if (!isDrawing || !penActive) return;
      e.preventDefault();
      const pos = getPos(e);
      ctx.lineTo(pos.x, pos.y);
      ctx.stroke();
    }

    function stopDraw() {
      if (!penActive) return;
      isDrawing = false;
      ctx.closePath();
    }

    canvas.addEventListener('mousedown', startDraw);
    canvas.addEventListener('mousemove', draw);
    canvas.addEventListener('mouseup', stopDraw);
    canvas.addEventListener('touchstart', startDraw, { passive: false });
    canvas.addEventListener('touchmove', draw, { passive: false });
    canvas.addEventListener('touchend', stopDraw);

    /* Grid Modal */
    function openGridModal() {
      const container = document.getElementById('tilesContainer');
      container.innerHTML = '';
      quizData.forEach((_, idx) => {
        const btn = document.createElement('button');
        btn.className = `tile-btn ${idx === currentIndex ? 'current' : ''}`;
        btn.textContent = idx + 1;
        btn.onclick = () => {
          currentIndex = idx;
          closeGridModal();
          if (isAutoRunning) runCurrentQuestionCycle();
          else renderScreen();
        };
        container.appendChild(btn);
      });
      document.getElementById('gridModal').style.display = 'flex';
    }

    function closeGridModal(e) {
      if (!e || e.target.id === 'gridModal' || e.target.tagName === 'BUTTON') {
        document.getElementById('gridModal').style.display = 'none';
      }
    }

    function openEditor() {
      stopAutoQuiz();
      document.getElementById('jsonBox').value = JSON.stringify(quizData, null, 2);
      document.getElementById('editorModal').style.display = 'flex';
    }
    function closeEditor() {
      document.getElementById('editorModal').style.display = 'none';
    }
    function saveQuestions() {
      try {
        const parsed = JSON.parse(document.getElementById('jsonBox').value);
        if (Array.isArray(parsed) && parsed.length > 0) {
          quizData = parsed;
          localStorage.setItem('quizData_saved', JSON.stringify(quizData));
          currentIndex = 0;
          closeEditor();
          renderScreen();
        }
      } catch (e) {
        alert('JSON error!');
      }
    }

    window.onload = () => {
      resizeCanvas();
      renderScreen();
      if ('speechSynthesis' in window) {
        window.speechSynthesis.getVoices();
      }
      document.body.addEventListener('touchstart', getCtx, { once: true });
      document.body.addEventListener('click', getCtx, { once: true });
    };
  </script>
</body>
</html>
