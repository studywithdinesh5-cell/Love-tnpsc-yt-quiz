<!DOCTYPE html>
<html lang="ta">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>LOVE TNPSC - Natural Voice Studio Quiz</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link href="https://fonts.googleapis.com/css2?family=Mukta+Malar:wght@600;700;800&family=Teko:wght@700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body, html {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background: #ffffff !important;
      font-family: 'Mukta Malar', sans-serif;
      color: #0b1536;
    }

    .main-wrapper {
      width: 100%;
      height: 100%;
      background: #ffffff;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 8px 18px;
      position: relative;
    }

    /* Top Bar */
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 5px;
      border-bottom: 1.5px solid #e2e8f0;
      gap: 6px;
      flex-shrink: 0;
      z-index: 10;
      flex-wrap: wrap;
    }

    .brand-tag {
      font-weight: 800;
      font-size: 13px;
      color: #1e3a8a;
      letter-spacing: 0.5px;
      white-space: nowrap;
    }

    .grid-trigger-btn {
      background: #f1f5f9;
      color: #0f172a;
      border: 1.5px solid #cbd5e1;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .nav-btn {
      background: #f1f5f9;
      color: #0f172a;
      border: 1px solid #cbd5e1;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .nav-btn:active {
      transform: scale(0.92);
      background: #e2e8f0;
    }

    /* குரல் வாசிப்பு பட்டன் */
    .voice-btn {
      background: #eff6ff;
      color: #1d4ed8;
      border: 1.5px solid #93c5fd;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: all 0.2s ease;
    }
    .voice-btn.speaking {
      background: #2563eb !important;
      color: #ffffff !important;
      border-color: #1d4ed8 !important;
      animation: pulseVoice 1.2s infinite;
    }

    @keyframes pulseVoice {
      0%, 100% { box-shadow: 0 0 0 0 rgba(37, 99, 235, 0.5); }
      50% { box-shadow: 0 0 0 6px rgba(37, 99, 235, 0); }
    }

    /* பென்சில் பட்டன் */
    .pen-toggle-btn {
      background: #f8fafc;
      color: #0f172a;
      border: 1.5px solid #cbd5e1;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: all 0.2s ease;
    }
    .pen-toggle-btn.active {
      background: #ef4444 !important;
      color: #ffffff !important;
      border-color: #dc2626 !important;
    }

    .start-btn-top {
      background: linear-gradient(135deg, #1e3a8a, #0f172a);
      color: #ffffff;
      font-size: 12px;
      font-weight: 800;
      border: none;
      padding: 6px 12px;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
      white-space: nowrap;
    }
    .start-btn-top:disabled {
      opacity: 0.6;
    }

    .btn-edit {
      background: #f8fafc;
      color: #334155;
      border: 1px solid #cbd5e1;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
    }

    /* கேள்வி வரி */
    .question-title {
      font-size: 21px;
      font-weight: 800;
      color: #0b1a78;
      line-height: 1.3;
      margin: 4px 0;
      flex-shrink: 0;
      cursor: pointer;
      z-index: 5;
    }

    /* நடுப்பகுதி: இடது பக்கம் ஆப்ஷன்கள், வலது பக்கம் எழுதுவதற்கான காலி இடம் */
    .body-content {
      display: flex;
      flex: 1;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin: 2px 0;
      overflow: hidden;
      position: relative;
    }

    .options-group {
      display: flex;
      flex-direction: column;
      gap: 7px;
      flex: 1;
      max-width: 52%;
      justify-content: center;
      z-index: 5;
    }

    .opt-box {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 18px;
      font-weight: 800;
      color: #000000;
      padding: 5px 12px;
      border-radius: 6px;
      background: #ffffff;
      transition: all 0.2s ease;
    }

    .opt-char {
      color: #000000;
      font-weight: 800;
      width: 24px;
    }

    .opt-box.is-correct {
      background-color: #10b981 !important;
      color: #ffffff !important;
      box-shadow: 0 3px 10px rgba(16, 185, 129, 0.4);
    }
    .opt-box.is-correct span {
      color: #ffffff !important;
    }

    .tick-badge {
      margin-left: auto;
      background: #ffffff;
      color: #059669;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 900;
      animation: popTick 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    @keyframes popTick {
      0% { transform: scale(0); }
      100% { transform: scale(1); }
    }

    .free-writing-space {
      flex: 1;
      height: 100%;
      position: relative;
    }

    .gold-timer {
      position: absolute;
      bottom: -4px;
      right: -4px;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #fef08a, #ca8a04 60%, #713f12 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 3px 10px rgba(161, 98, 7, 0.4);
      border: 2px solid #fef9c3;
      z-index: 10;
    }

    .timer-num {
      font-family: 'Teko', sans-serif;
      font-size: 34px;
      font-weight: 700;
      color: #ffffff;
      line-height: 1;
      text-shadow: 0 2px 4px rgba(0,0,0,0.5);
    }

    /* Drawing Layer */
    #drawingCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 15;
      pointer-events: none;
      touch-action: none;
    }
    #drawingCanvas.pen-active {
      pointer-events: auto;
      cursor: crosshair;
    }

    /* Pen Toolbar */
    .pen-palette {
      display: none;
      position: absolute;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      background: #0f172a;
      padding: 5px 14px;
      border-radius: 30px;
      align-items: center;
      gap: 10px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.25);
      z-index: 25;
    }

    .color-dot {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      cursor: pointer;
      border: 2px solid #ffffff;
    }
    .color-dot.selected {
      transform: scale(1.25);
      border-color: #facc15;
    }

    .pen-action-btn {
      background: rgba(255,255,255,0.2);
      color: #ffffff;
      border: none;
      padding: 4px 8px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 800;
      cursor: pointer;
    }

    /* Comment Banner */
    .comment-banner {
      display: none;
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, 0.94);
      backdrop-filter: blur(4px);
      border-radius: 14px;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 12px;
      z-index: 20;
      padding: 16px;
      text-align: center;
    }

    .comment-text-main {
      font-size: 24px;
      font-weight: 800;
      color: #facc15;
    }

    .comment-text-sub {
      font-size: 16px;
      font-weight: 700;
      color: #ffffff;
    }

    /* Grid Modal */
    .grid-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.7);
      backdrop-filter: blur(4px);
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 12px;
    }
    .grid-content {
      background: #ffffff;
      border-radius: 14px;
      padding: 16px;
      width: 100%;
      max-width: 600px;
      max-height: 85vh;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .tiles-wrapper {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(44px, 1fr));
      gap: 8px;
      overflow-y: auto;
      max-height: 60vh;
      padding: 4px;
    }
    .tile-btn {
      background: #f1f5f9;
      color: #0f172a;
      border: 1.5px solid #cbd5e1;
      padding: 8px 0;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
    }
    .tile-btn.current {
      background: #1e3a8a;
      color: #ffffff;
      border-color: #1e3a8a;
    }

    /* Upload Modal */
    .modal-wrap {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      align-items: center;
      justify-content: center;
      z-index: 100;
    }
    .modal-card {
      background: #ffffff;
      border-radius: 12px;
      padding: 16px;
      width: 90%;
      max-width: 500px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .modal-card textarea {
      width: 100%;
      height: 160px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      padding: 8px;
      font-size: 12px;
      font-family: monospace;
    }
  </style>
</head>
<body>

  <div class="main-wrapper">

    <!-- Header Bar -->
    <div class="header-bar">
      <div style="display: flex; align-items: center; gap: 6px;">
        <span class="brand-tag">LOVE TNPSC</span>
        <button id="gridBtn" class="grid-trigger-btn" onclick="openGridModal()">
          <span>🔢 வினா</span>
          <span id="qBadgeNum" class="text-indigo-900 font-black">01/50</span>
          <span>▼</span>
        </button>
      </div>

      <div style="display: flex; align-items: center; gap: 5px;">
        <button class="nav-btn" onclick="prevQuestion()" title="முந்தைய கேள்வி">◀ பின்</button>
        <button class="nav-btn" onclick="nextQuestion()" title="அடுத்த கேள்வி">முன் ▶</button>
        
        <!-- இயல்பான தமிழ் குரல் வாசிப்பு பட்டன் -->
        <button id="voiceReadBtn" class="voice-btn" onclick="toggleReadQuestion()">
          <span>🔊</span>
          <span id="voiceBtnText">வாசி</span>
        </button>

        <!-- பென்சில் பட்டன் -->
        <button id="penToggleBtn" class="pen-toggle-btn" onclick="togglePenMode()">
          <span>✏️</span>
          <span id="penBtnText">எழுது</span>
        </button>
      </div>
      
      <button id="startBtn" class="start-btn-top" onclick="startTimer()">
        ⏱️ டைமர் (5s)
      </button>

      <button class="btn-edit" onclick="openEditor()">➕ கேள்விகள்</button>
    </div>

    <!-- Question Line -->
    <h1 id="qText" class="question-title" onclick="openGridModal()"></h1>

    <!-- Body -->
    <div class="body-content">
      <div class="options-group">
        <div id="optRow0" class="opt-box">
          <span class="opt-char">a)</span>
          <span id="optText0"></span>
          <div id="tick0"></div>
        </div>
        <div id="optRow1" class="opt-box">
          <span class="opt-char">b)</span>
          <span id="optText1"></span>
          <div id="tick1"></div>
        </div>
        <div id="optRow2" class="opt-box">
          <span class="opt-char">c)</span>
          <span id="optText2"></span>
          <div id="tick2"></div>
        </div>
        <div id="optRow3" class="opt-box">
          <span class="opt-char">d)</span>
          <span id="optText3"></span>
          <div id="tick3"></div>
        </div>
      </div>

      <div class="free-writing-space">
        <div class="gold-timer">
          <span id="timerVal" class="timer-num">5</span>
        </div>
      </div>

      <div id="commentBanner" class="comment-banner">
        <div style="font-size: 38px;">💬</div>
        <div class="comment-text-main">இதற்கான சரியான விடை என்ன?</div>
        <div class="comment-text-sub">உங்க பதிலை உடனே கீழே Comment பண்ணுங்க! 👇</div>
      </div>
    </div>

    <!-- Drawing Canvas -->
    <canvas id="drawingCanvas"></canvas>

    <!-- Pen Toolbar -->
    <div id="penPalette" class="pen-palette" style="display: none;">
      <div class="color-dot selected" style="background: #ef4444;" onclick="setPenColor('#ef4444', this)"></div>
      <div class="color-dot" style="background: #eab308;" onclick="setPenColor('#eab308', this)"></div>
      <div class="color-dot" style="background: #10b981;" onclick="setPenColor('#10b981', this)"></div>
      <div class="color-dot" style="background: #2563eb;" onclick="setPenColor('#2563eb', this)"></div>
      <button class="pen-action-btn" onclick="clearCanvas()">🗑️ அழி</button>
      <button class="pen-action-btn" style="background: #ef4444;" onclick="togglePenMode()">✕ மூடு</button>
    </div>

  </div>

  <!-- Grid Modal -->
  <div id="gridModal" class="grid-modal" onclick="closeGridModal(event)">
    <div class="grid-content" onclick="event.stopPropagation()">
      <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #e2e8f0; padding-bottom: 6px;">
        <h3 style="font-size: 15px; font-weight: 800; color: #0b1a78;">வினா எண்ணைத் தேர்ந்தெடுக்கவும்:</h3>
        <button style="border: none; background: none; font-size: 18px; font-weight: bold; cursor: pointer;" onclick="closeGridModal()">✕</button>
      </div>
      <div id="tilesContainer" class="tiles-wrapper"></div>
    </div>
  </div>

  <!-- Upload Modal -->
  <div id="editorModal" class="modal-wrap">
    <div class="modal-card">
      <h3 style="font-size: 15px; font-weight: 800; color: #0b1a78;">JSON குறியீட்டை ஒட்டவும்:</h3>
      <textarea id="jsonBox"></textarea>
      <div style="display: flex; gap: 8px; justify-content: flex-end;">
        <button style="padding: 6px 14px; border: none; background: #e2e8f0; border-radius: 6px; font-weight: 700; cursor: pointer;" onclick="closeEditor()">ரத்து</button>
        <button style="padding: 6px 14px; border: none; background: #10b981; color: #fff; border-radius: 6px; font-weight: 700; cursor: pointer;" onclick="saveQuestions()">சேமி & இயக்கு</button>
      </div>
    </div>
  </div>

  <script>
    let defaultQuizData = [
      {"question": "Q) 'அரை' - 'அறை' என்ற சொற்களின் சரியான பொருள் வேறுபாட்டைத் தேர்க:", "options": ["சமையலறை - ஆடை", "பாதி - அறைதல் / அறை", "ஒலித்தல் - பாதி", "உடை - சுத்தியல்"], "correct": 1},
      {"question": "Q) 'இரை' - 'இறை' என்ற மயங்கொலிச் சொற்களின் முறையான பொருள் யாது?", "options": ["உணவு - கடவுள் / அரசன்", "சத்தம் - இறைத்தல்", "அரசன் - உணவு", "விதைத்தல் - இரைச்சல்"], "correct": 0},
      {"question": "Q) 'கூரை' - 'கூறை' பொருள் வேறுபாட்டைக் கண்டறிக:", "options": ["புடவை - வீட்டின் உச்சி", "வெட்டுதல் - உடை", "வீட்டின் கூரை - புடவை", "கூர்மையானது - ஆடை"], "correct": 2}
    ];

    let quizData = JSON.parse(localStorage.getItem('quizData_saved')) || defaultQuizData;
    let currentIndex = parseInt(localStorage.getItem('quiz_last_index')) || 0;
    if (currentIndex >= quizData.length) currentIndex = 0;

    let timerRunning = false;
    let countdown = 5;
    let timerHandle = null;

    /* ===================================================================== */
    /* இயல்பான மனிதக் குரல் வாசிப்பு (Natural Human-like Tamil Voice Engine) */
    /* ===================================================================== */
    let selectedTamilVoice = null;
    let isSpeaking = false;

    function loadBestTamilVoice() {
      const voices = window.speechSynthesis.getVoices();
      // iOS-ல் உள்ள மிகத் தெளிவான 'Vani' அல்லது 'Lekha' அல்லது 'ta-IN' குரலைத் தேர்ந்தெடுத்தல்
      selectedTamilVoice = 
        voices.find(v => v.lang.includes('ta') && (v.name.includes('Vani') || v.name.includes('Enhanced') || v.name.includes('Premium') || v.name.includes('Valluvar'))) ||
        voices.find(v => v.lang === 'ta-IN') ||
        voices.find(v => v.lang.startsWith('ta'));
    }

    if ('speechSynthesis' in window) {
      loadBestTamilVoice();
      window.speechSynthesis.onvoiceschanged = loadBestTamilVoice;
    }

    function stopSpeech() {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
      }
      isSpeaking = false;
      const btn = document.getElementById('voiceReadBtn');
      const txt = document.getElementById('voiceBtnText');
      if (btn) btn.classList.remove('speaking');
      if (txt) txt.textContent = 'வாசி';
    }

    // வாக்கியங்களை இயல்பான இடைவெளியுடன் (Natural Pauses) சுத்தப்படுத்தி வாசித்தல்
    function cleanTextForHumanSpeech(text) {
      return text
        .replace(/^Q\)\s*/i, '') // 'Q)' என்பதை வாசிக்காமல் தவிர்த்தல்
        .replace(/-/g, ', ')     // '-' வரும் இடத்தில் சிறிய மூச்சு இடைவெளி
        .replace(/\//g, ' அல்லது ') // '/' வரும் இடத்தில் 'அல்லது' என இயல்பாக வாசித்தல்
        .replace(/_/g, ' என்ன ');
    }

    function speakNaturalTamil(sentencesArray, onCompleteCallback) {
      if (!('speechSynthesis' in window)) return;
      stopSpeech();
      loadBestTamilVoice();

      isSpeaking = true;
      const btn = document.getElementById('voiceReadBtn');
      const txt = document.getElementById('voiceBtnText');
      btn.classList.add('speaking');
      txt.textContent = 'நிறுத்து';

      let idx = 0;
      function speakNextChunk() {
        if (!isSpeaking || idx >= sentencesArray.length) {
          stopSpeech();
          if (onCompleteCallback) onCompleteCallback();
          return;
        }

        const utter = new SpeechSynthesisUtterance(sentencesArray[idx]);
        if (selectedTamilVoice) {
          utter.voice = selectedTamilVoice;
        }
        utter.lang = 'ta-IN';
        // ரோபோட்டிக் தன்மையை நீக்க இயல்பான வேகம் & சுருதி
        utter.rate = 0.93;  
        utter.pitch = 1.02; 

        utter.onend = () => {
          idx++;
          // ஒவ்வொரு வரிக்கும் இடையே மனிதர் மூச்சு விடுவது போன்ற 300ms இடைவெளி
          setTimeout(speakNextChunk, 300);
        };

        utter.onerror = () => {
          stopSpeech();
        };

        window.speechSynthesis.speak(utter);
      }

      speakNextChunk();
    }

    // "🔊 வாசி" பட்டனை அழுத்தும்போது கேள்வி + 4 ஆப்ஷன்களை வாசித்தல்
    function toggleReadQuestion() {
      if (isSpeaking) {
        stopSpeech();
        return;
      }

      const q = quizData[currentIndex];
      const qClean = cleanTextForHumanSpeech(q.question);
      const chunks = [
        qClean,
        `ஆப்ஷன் ஏ, ${cleanTextForHumanSpeech(q.options[0])}`,
        `ஆப்ஷன் பி, ${cleanTextForHumanSpeech(q.options[1])}`,
        `ஆப்ஷன் சி, ${cleanTextForHumanSpeech(q.options[2])}`,
        `ஆப்ஷன் டி, ${cleanTextForHumanSpeech(q.options[3])}`
      ];

      speakNaturalTamil(chunks);
    }

    // விடை வெளியிடப்படும்போது சரியான விடையை மட்டும் வாசித்தல்
    function speakCorrectAnswer(ansText) {
      const cleanAns = cleanTextForHumanSpeech(ansText);
      speakNaturalTamil([`சரியான விடை, ${cleanAns}`]);
    }

    /* Web Audio Sound Effects */
    let audioCtx = null;
    function getCtx() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      return audioCtx;
    }

    function playTick() {
      try {
        const ctx = getCtx();
        const now = ctx.currentTime;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(850, now);
        osc.frequency.exponentialRampToValueAtTime(150, now + 0.04);
        gain.gain.setValueAtTime(0.35, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.04);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + 0.04);
      } catch (e) {}
    }

    function playDing() {
      try {
        const ctx = getCtx();
        const now = ctx.currentTime;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(880, now);
        osc.frequency.exponentialRampToValueAtTime(1046, now + 0.08);
        gain.gain.setValueAtTime(0.08, now);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.4);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + 0.4);
      } catch (e) {}
    }

    function renderScreen() {
      stopSpeech();
      clearInterval(timerHandle);
      timerRunning = false;
      countdown = 5;

      localStorage.setItem('quiz_last_index', currentIndex);

      const q = quizData[currentIndex];
      document.getElementById('qBadgeNum').textContent = `${String(currentIndex + 1).padStart(2, '0')}/${String(quizData.length).padStart(2, '0')}`;
      document.getElementById('qText').textContent = q.question;
      document.getElementById('timerVal').textContent = '5';
      document.getElementById('commentBanner').style.display = 'none';

      const btn = document.getElementById('startBtn');
      btn.disabled = false;
      btn.textContent = '⏱️ டைமர் (5s)';

      for (let i = 0; i < 4; i++) {
        document.getElementById(`optText${i}`).textContent = q.options[i];
        document.getElementById(`optRow${i}`).className = 'opt-box';
        document.getElementById(`tick${i}`).innerHTML = '';
      }

      clearCanvas();
    }

    function nextQuestion() {
      if (currentIndex < quizData.length - 1) {
        currentIndex++;
        renderScreen();
      }
    }

    function prevQuestion() {
      if (currentIndex > 0) {
        currentIndex--;
        renderScreen();
      }
    }

    function startTimer() {
      stopSpeech();
      getCtx();
      if (timerRunning) return;
      timerRunning = true;
      countdown = 5;

      const btn = document.getElementById('startBtn');
      btn.disabled = true;
      btn.textContent = 'ஓடுகிறது...';

      playTick();
      document.getElementById('timerVal').textContent = countdown;

      timerHandle = setInterval(() => {
        countdown--;
        if (countdown > 0) {
          playTick();
          document.getElementById('timerVal').textContent = countdown;
        } else {
          clearInterval(timerHandle);
          document.getElementById('timerVal').textContent = '0';
          revealAnswer();
        }
      }, 1000);
    }

    function revealAnswer() {
      playDing();
      const q = quizData[currentIndex];
      const isLastQuestion = (currentIndex === quizData.length - 1);

      if (isLastQuestion) {
        document.getElementById('commentBanner').style.display = 'flex';
        document.getElementById('startBtn').textContent = 'கமெண்ட் பண்ணுங்க!';
        speakNaturalTamil(['இதற்கான சரியான விடை என்ன? உங்கள் பதிலை கீழே கமெண்ட் பண்ணுங்க!']);
        return;
      }

      const correctIdx = q.correct;
      const row = document.getElementById(`optRow${correctIdx}`);
      row.classList.add('is-correct');
      document.getElementById(`tick${correctIdx}`).innerHTML = '<span class="tick-badge">✔</span>';
      document.getElementById('startBtn').textContent = 'சரியான விடை!';

      // விடை பச்சை நிறத்தில் மாறியதும் இயல்பான குரலில் விடையை வாசிக்கும்
      speakCorrectAnswer(q.options[correctIdx]);
    }

    /* Pen Engine */
    const canvas = document.getElementById('drawingCanvas');
    const ctx = canvas.getContext('2d');
    let isDrawing = false;
    let penActive = false;
    let penColor = '#ef4444';
    let penSize = 3.5;

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);

    function togglePenMode() {
      penActive = !penActive;
      const penBtn = document.getElementById('penToggleBtn');
      const penText = document.getElementById('penBtnText');
      const palette = document.getElementById('penPalette');

      if (penActive) {
        canvas.classList.add('pen-active');
        penBtn.classList.add('active');
        penText.textContent = 'எழுதுகிறது...';
        palette.style.display = 'flex';
      } else {
        canvas.classList.remove('pen-active');
        penBtn.classList.remove('active');
        penText.textContent = 'எழுது';
        palette.style.display = 'none';
      }
    }

    function setPenColor(color, el) {
      penColor = color;
      document.querySelectorAll('.color-dot').forEach(d => d.classList.remove('selected'));
      el.classList.add('selected');
    }

    function clearCanvas() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
    }

    function getPos(e) {
      return {
        x: e.clientX || (e.touches && e.touches[0].clientX),
        y: e.clientY || (e.touches && e.touches[0].clientY)
      };
    }

    function startDraw(e) {
      if (!penActive) return;
      isDrawing = true;
      const pos = getPos(e);
      ctx.beginPath();
      ctx.moveTo(pos.x, pos.y);
      ctx.strokeStyle = penColor;
      ctx.lineWidth = penSize;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
    }

    function draw(e) {
      if (!isDrawing || !penActive) return;
      e.preventDefault();
      const pos = getPos(e);
      ctx.lineTo(pos.x, pos.y);
      ctx.stroke();
    }

    function stopDraw() {
      if (!penActive) return;
      isDrawing = false;
      ctx.closePath();
    }

    canvas.addEventListener('mousedown', startDraw);
    canvas.addEventListener('mousemove', draw);
    canvas.addEventListener('mouseup', stopDraw);
    canvas.addEventListener('touchstart', startDraw, { passive: false });
    canvas.addEventListener('touchmove', draw, { passive: false });
    canvas.addEventListener('touchend', stopDraw);

    /* Grid Modal */
    function openGridModal() {
      const container = document.getElementById('tilesContainer');
      container.innerHTML = '';
      quizData.forEach((_, idx) => {
        const btn = document.createElement('button');
        btn.className = `tile-btn ${idx === currentIndex ? 'current' : ''}`;
        btn.textContent = idx + 1;
        btn.onclick = () => {
          currentIndex = idx;
          renderScreen();
          closeGridModal();
        };
        container.appendChild(btn);
      });
      document.getElementById('gridModal').style.display = 'flex';
    }

    function closeGridModal(e) {
      if (!e || e.target.id === 'gridModal' || e.target.tagName === 'BUTTON') {
        document.getElementById('gridModal').style.display = 'none';
      }
    }

    function openEditor() {
      document.getElementById('jsonBox').value = JSON.stringify(quizData, null, 2);
      document.getElementById('editorModal').style.display = 'flex';
    }
    function closeEditor() {
      document.getElementById('editorModal').style.display = 'none';
    }
    function saveQuestions() {
      try {
        const parsed = JSON.parse(document.getElementById('jsonBox').value);
        if (Array.isArray(parsed) && parsed.length > 0) {
          quizData = parsed;
          localStorage.setItem('quizData_saved', JSON.stringify(quizData));
          currentIndex = 0;
          closeEditor();
          renderScreen();
        }
      } catch (e) {
        alert('JSON error!');
      }
    }

    window.onload = () => {
      resizeCanvas();
      renderScreen();
      loadBestTamilVoice();
      document.body.addEventListener('touchstart', getCtx, { once: true });
      document.body.addEventListener('click', getCtx, { once: true });
    };
  </script>
</body>
</html>
