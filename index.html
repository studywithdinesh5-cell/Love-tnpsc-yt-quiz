<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tamil Auto-Voice Quiz Studio</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background: #0f172a; color: #f8fafc; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
        .container { width: 100%; max-width: 600px; background: #1e293b; border-radius: 20px; padding: 25px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); border: 1px solid #334155; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid #334155; padding-bottom: 15px; }
        .timer-box { font-size: 24px; font-weight: bold; background: #ef4444; color: white; padding: 5px 15px; border-radius: 50px; display: inline-flex; align-items: center; gap: 8px; }
        .q-count { font-size: 14px; color: #94a3b8; background: #334155; padding: 6px 12px; border-radius: 8px; }
        .question-text { font-size: 20px; font-weight: 600; line-height: 1.5; margin-bottom: 20px; color: #f1f5f9; min-height: 80px; }
        .options-list { display: flex; flex-direction: column; gap: 12px; margin-bottom: 20px; }
        .option-btn { background: #334155; border: 2px solid transparent; color: white; padding: 15px 20px; font-size: 16px; border-radius: 12px; text-align: left; cursor: pointer; transition: all 0.2s ease; }
        .option-btn.correct { background: #10b981 !important; border-color: #059669; color: white; font-weight: bold; transform: scale(1.02); }
        .start-screen { text-align: center; padding: 40px 20px; }
        .start-screen h1 { font-size: 26px; margin-bottom: 15px; color: #38bdf8; }
        .start-screen p { color: #94a3b8; margin-bottom: 25px; font-size: 15px; line-height: 1.6; }
        .btn-primary { background: #38bdf8; color: #0f172a; border: none; padding: 15px 35px; font-size: 18px; font-weight: bold; border-radius: 12px; cursor: pointer; transition: 0.2s; box-shadow: 0 4px 12px rgba(56, 189, 248, 0.4); }
        .btn-primary:active { transform: scale(0.98); }
        .audio-status { font-size: 13px; color: #f59e0b; margin-top: 10px; text-align: center; }
    </style>
</head>
<body>

<div class="container" id="appContainer">
    <!-- Start Screen -->
    <div id="startScreen" class="start-screen">
        <h1>தமிழ் ஆட்டோ வாய்ஸ் குவிஸ்</h1>
        <p>50 கேள்விகள், இயல்பான தமிழ் குரல் வாசிப்பு, 5 வினாடி டைமர் மற்றும் சரியான விடை தானாக டிக் ஆகும் வசதியுடன்!</p>
        <button class="btn-primary" onclick="startQuiz()">வினாடி-வினா தொடங்கு 🚀</button>
        <div class="audio-status">💡 ஐபோனில் சவுண்ட் கேட்க சைலன்ட் மோட்டை ஆஃப் செய்யவும்</div>
    </div>

    <!-- Quiz Screen -->
    <div id="quizScreen" style="display: none;">
        <div class="header">
            <span class="q-count" id="qCount">கேள்வி 1/50</span>
            <div class="timer-box">⏳ <span id="timerVal">5</span>வி</div>
        </div>
        
        <div class="question-text" id="qText">கேள்வி லோட் ஆகிறது...</div>
        
        <div class="options-list" id="optionsList">
            <!-- Options injected dynamically -->
        </div>
    </div>
</div>

<script>
    // 50 தமிழ் பொது அறிவு மற்றும் TNPSC கேள்விகள்
    const questions = [
        { q: "தமிழ்நாட்டின் தலைநகரம் எது?", o: ["மதுரை", "சென்னை", "கோயம்புத்தூர்", "சேலம்"], a: 1 },
        { q: "இந்தியாவின் தேசிய விலங்கு எது?", o: ["சிங்கம்", "புலி", "யானை", "சிறுத்தை"], a: 1 },
        { q: "மகாத்மா காந்தி பிறந்த ஆண்டு எது?", o: ["1869", "1947", "1950", "1920"], a: 0 },
        { q: "காவிரி நதி எங்கு கலக்கிறது?", o: ["அரபிக் கடல்", "வங்காள விரிகுடா", "இந்தியப் பெருங்கடல்", "செங்கடல்"], a: 1 },
        { q: "இந்திய அரசியலமைப்பின் தந்தை என அழைக்கப்படுபவர் யார்?", o: ["மகாத்மா காந்தி", "ஜவஹர்லால் நேரு", "டாக்டர் பி.ஆர். அம்பேத்கர்", "வல்லபாய் படேல்"], a: 2 },
        { q: "தமிழ்நாட்டின் மாநிலப் பறவை எது?", o: ["மயில்", "மரகதப் புறா", "குயில்", "சிட்டுக்குருவி"], a: 1 },
        { q: "உலகப் புகழ்பெற்ற தாஜ்மஹால் எந்த நகரில் அமைந்துள்ளது?", o: ["டெல்லி", "ஆக்ரா", "மும்பை", "ஜெய்ப்பூர்"], a: 1 },
        { q: "கணிப்பொறியின் தந்தை என அழைக்கப்படுபவர் யார்?", o: ["சார்லஸ் பாபேஜ்", "ஆல்பர்ட் ஐன்ஸ்டீன்", "தாமஸ் ஆல்வா எடிசன்", "ஐசக் நியூட்டன்"], a: 0 },
        { q: "இந்தியாவின் தேசிய மலர் எது?", o: ["ரோஜா", "மல்லிகை", "தாமரை", "சூரியகாந்தி"], a: 2 },
        { q: "தமிழ்நாட்டின் மிக நீளமான நதி எது?", o: ["வைகை", "தாமிரபரணி", "காவிரி", "பவானி"], a: 2 },
        { q: "நிலவுக்கு மனிதனை அனுப்பிய முதல் நாடு எது?", o: ["ரஷ்யா", "அமெரிக்கா", "சீனா", "இந்தியா"], a: 1 },
        { q: "செவ்வாய் கிரகம் எந்த நிறத்தில் தோன்றும்?", o: ["நீலம்", "மஞ்சள்", "சிவப்பு", "பச்சை"], a: 2 },
        { q: "இந்தியாவின் முதல் குடிமகன் யார்?", o: ["பிரதமர்", "குடியரசுத் தலைவர்", "தலைமை நீதிபதி", "முதலமைச்சர்"], a: 1 },
        { q: "கணினி எதனால் இயக்கப்படுகிறது?", o: ["மென்பொருள் மற்றும் வன்பொருள்", "மட்டும் மின்சாரம்", "பேப்பர்", "எரிபொருள்"], a: 0 },
        { q: "பஞ்சாப் மாநிலத்தின் தலைநகரம் எது?", o: ["சண்டிகர்", "அमृतసర్", "லூதியானா", "ஜலந்தர்"], a: 0 },
        { q: "கிரிக்கெட் விளையாட்டில் எத்தனை வீரர் விளையாடுவர்?", o: ["9", "10", "11", "12"], a: 2 },
        { q: "இந்தியாவின் தேசிய மரம் எது?", o: ["அரச மரம்", "ஆல மரம்", "வேப்ப மரம்", "மா மரம்"], a: 1 },
        { q: "தமிழ்நாட்டின் மாநில மரம் எது?", o: ["பனை மரம்", "தென்னை மரம்", "புளிய மரம்", "தேக்கு மரம்"], a: 0 },
        { q: "சூரிய குடும்பத்தின் மிகப்பெரிய கோள் எது?", o: ["செவ்வாய்", "வியாழன்", "ச சனி", "புதன்"], a: 1 },
        { q: "மனித உடலில் உள்ள எலும்புகளின் எண்ணிக்கை எத்தனை?", o: ["206", "208", "210", "200"], a: 0 },
        { q: "இந்தியாவின் தேசியப் பழம் எது?", o: ["வாழைப்பழம்", "மாம்பழம்", "ஆப்பிள்", "பலாப்பழம்"], a: 1 },
        { q: "தமிழ்நாட்டின் திருவிழாக்களின் நகரம் என அழைக்கப்படுவது எது?", o: ["சென்னை", "மதுரை", "தஞ்சாவூர்", "திருச்சி"], a: 1 },
        { q: "இந்தியாவின் முதல் பிரதமர் யார்?", o: ["மகாத்மா காந்தி", "ஜவஹர்லால் நேரு", "ராஜேந்திர பிரசாத்", "சுभाष சந்திர போஸ்"], a: 1 },
        { q: "கண்ணாடி எதிலிருந்து தயாரிக்கப்படுகிறது?", o: ["மணல்", "களிமண்", "சுண்ணாம்பு", "கரி"], a: 0 },
        { q: "உலகிலேயே மிகப்பெரிய கண்டம் எது?", o: ["ஆப்பிரிக்கா", "ஆசியா", "ஐரோப்பா", "வட அமெரிக்கா"], a: 1 },
        { q: "இந்தியாவின் தேசிய விளையாட்டு எது?", o: ["கிரிக்கெட்", "ஹாக்கி", "கபடி", " கால்பந்து"], a: 1 },
        { q: "தமிழ்நாட்டின் மிக உயரமான சிகரம் எது?", o: ["தொட்டபெட்டா", "முகுர்த்தி", "நீலகிரி", "ஆனைமுடி"], a: 3 },
        { q: "நம் தேசியக் கொடியில் உள்ள சக்கரத்தில் எத்தனை spokes உள்ளன?", o: ["20", "22", "24", "26"], a: 2 },
        { q: "மனிதனின் இரத்தத்தில் உள்ள முக்கியப் பகுதிப்பொருள் எது?", o: ["ஹீமோகுளோபின்", "பிளாஸ்மா", "வெள்ளை அணுக்கள்", "நரம்புகள்"], a: 1 },
        { q: "இந்தியாவின் மின்னணு தலைநகரம் எது?", o: ["மும்பை", "பெங்களூரு", "ஹைதராபாத்", "சென்னை"], a: 1 },
        { q: "தமிழ்நாட்டின் மாநில விலங்கு எது?", o: ["நீலகிரி வரையாடு", "புலி", "சிறுத்தை", "கரடி"], a: 0 },
        { q: "தண்ணீரின் வேதியியல் குறிப்பீடு என்ன?", o: ["H2O", "CO2", "NaCl", "O2"], a: 0 },
        { q: "இந்தியாவின் தேசிய கீதத்தை எழுதியவர் யார்?", o: ["பக்கிம் சந்திர சட்டர்ஜி", "ரவீந்திரநாத் தாகூர்", "சுப்பிரமணிய பாரதியார்", "மகாத்மா காந்தி"], a: 1 },
        { q: "மிகக் குறைந்த எடையுள்ள தனிப்பொருள் எது?", o: ["ஹைட்ரஜன்", "ஹீலியம்", "லித்தியம்", "கார்பன்"], a: 0 },
        { q: "தமிழ் மொழியின் முதல் காப்பியம் எது?", o: ["சிலப்பதிகாரம்", "மணிமேகலை", "சீவக சிந்தாமணி", "கம்பராமாயணம்"], a: 0 },
        { q: "உலகின் மிக ஆழமான பகுதி எது?", o: ["மரியானா அகழி", "இந்தியப் பெருங்கடல்", "பசிபிக் பெருங்கடல்", "அட்லாண்டிக் அகழி"], a: 0 },
        { q: "இந்தியாவின் முதல் விண்வெளி வீரர் யார்?", o: ["ராாகேஷ் சர்மா", "கல்பனா சாவ்லா", "சுனிதா வில்லியம்ஸ்", "ஏ.பி.ஜே. அப்துல் கலாம்"], a: 0 },
        { q: "நம் நாட்டின் தேசியப் பாடல் எது?", o: ["ஜன கண மன", "வந்தே மாதரம்", "தமிழ்த்தாய் வாழ்த்து", "நமது நாடு"], a: 1 },
        { q: "தமிழ்நாட்டின் குட்டி ஜப்பான் என அழைக்கப்படுவது எது?", o: ["கோயம்புத்தூர்", "சிவகாசி", "திருப்பூர்", "சேலம்"], a: 1 },
        { q: "மின்னல் எதனால் ஏற்படுகிறது?", o: ["மின்சார இறக்கம்", "காற்றின் வேகம்", "வெப்பம்", "மழை"], a: 0 },
        { q: "இந்தியாவில் அதிக காடுகளைக் கொண்ட மாநிலம் எது?", o: ["கேரளா", "மத்தியப் பிரதேசம்", "அசாம்", "கர்நாடகா"], a: 1 },
        { q: "மனிதனின் இயல்பான உடல் வெப்பநிலை என்ன?", o: ["98.4°F", "95.6°F", "100.2°F", "97.0°F"], a: 0 },
        { q: "தமிழ்நாட்டின் மாஸ்டர் பிளான் நகரம் என அழைக்கப்படுவது எது?", o: ["அண்ணா நகர்", "கோயம்புத்தூர்", "மதுரை", "சென்னை"], a: 0 },
        { q: "உப்பு சத்தியாகிரகப் போராட்டம் நடைபெற்ற ஆண்டு எது?", o: ["1920", "1930", "1942", "1947"], a: 1 },
        { q: "இந்தியாவின் மிகப்பெரிய நதி எது?", o: ["யமுனை", "கங்கை", "பிரம்மபுத்ரா", "நர்மதா"], a: 1 },
        { q: "சென்னையின் பழைய பெயர் என்ன?", o: ["மெட்ராஸ்", "செண்பகபுரம்", "புனித ஜார்ஜ் கோட்டை", "கோடம்பாக்கம்"], a: 0 },
        { q: "கம்பராமாயணத்தை இயற்றியவர் யார்?", o: ["கம்பர்", "சேக்கிழார்", "இளங்கோவடிகள்", "பாரதியார்"], a: 0 },
        { q: "இந்தியாவின் முதல் பெண் பிரதமர் யார்?", o: ["பிரதிபா பாட்டீல்", "இந்திரா காந்தி", "சரோஜினி நாயுடு", "கல்பனா சாவ்லா"], a: 1 },
        { q: "நம் சூரிய குடும்பத்தின் மையம் எது?", o: ["பூமி", "சூரியன்", "சந்திரன்", "வியாழன்"], a: 1 },
        { q: "தமிழ்நாட்டின் மாநில மலர் எது?", o: ["செங்காந்தள் மலர்", "மல்லிகை", "ரோஜா", "தாமரை"], a: 0 }
    ];

    let currentIdx = 0;
    let timer = 5;
    let timerInterval = null;
    let synth = window.speechSynthesis;
    let tamilVoice = null;

    // Load Tamil Voice
    function loadVoices() {
        let voices = synth.getVoices();
        tamilVoice = voices.find(v => v.lang.includes('ta') || v.lang.includes('IN')) || voices[0];
    }
    if (synth.onvoiceschanged !== undefined) {
        synth.onvoiceschanged = loadVoices;
    }
    loadVoices();

    function startQuiz() {
        document.getElementById('startScreen').style.display = 'none';
        document.getElementById('quizScreen').style.display = 'block';
        loadQuestion();
    }

    function speakText(text, callback) {
        if (!synth) {
            if(callback) callback();
            return;
        }
        synth.cancel();
        let utterance = new SpeechSynthesisUtterance(text);
        utterance.voice = tamilVoice;
        utterance.rate = 1.0;
        utterance.pitch = 1.0;
        utterance.onend = () => { if(callback) callback(); };
        utterance.onerror = () => { if(callback) callback(); };
        synth.speak(utterance);
    }

    function loadQuestion() {
        if (currentIdx >= questions.length) {
            document.getElementById('quizScreen').innerHTML = `<h2 style="text-align:center; color:#38bdf8; padding:40px;">அனைத்து கேள்விகளும் முடிவடைந்தன! வாழ்த்துகள்! 🎉</h2>`;
            speakText("அனைத்து கேள்விகளும் முடிவடைந்தன. வாழ்த்துகள்.");
            return;
        }

        let q = questions[currentIdx];
        document.getElementById('qCount').innerText = `கேள்வி ${currentIdx + 1}/50`;
        document.getElementById('qText').innerText = q.q;

        let optionsHTML = '';
        q.o.forEach((opt, idx) => {
            optionsHTML += `<div class="option-btn" id="opt${idx}">${String.fromCharCode(65 + idx)}. ${opt}</div>`;
        });
        document.getElementById('optionsList').innerHTML = optionsHTML;

        // Speak Question and Options
        let fullText = `${q.q}. ஆப்ஷன்கள்: ஏ. ${q.o[0]}, பி. ${q.o[1]}, சி. ${q.o[2]}, டி. ${q.o[3]}`;
        
        speakText(fullText, () => {
            startTimer();
        });
    }

    function startTimer() {
        timer = 5;
        document.getElementById('timerVal').innerText = timer;
        
        if (timerInterval) clearInterval(timerInterval);

        timerInterval = setInterval(() => {
            timer--;
            document.getElementById('timerVal').innerText = timer;

            if (timer <= 0) {
                clearInterval(timerInterval);
                revealAnswer();
            }
        }, 1000);
    }

    function revealAnswer() {
        let q = questions[currentIdx];
        let correctOpt = q.a;
        
        // Highlight correct option
        document.getElementById(`opt${correctOpt}`).classList.add('correct');
        
        let answerText = `சரியான விடை: ${q.o[correctOpt]}`;
        speakText(answerText, () => {
            setTimeout(() => {
                currentIdx++;
                loadQuestion();
            }, 2000); // 2 seconds break before next question
        });
    }
</script>
