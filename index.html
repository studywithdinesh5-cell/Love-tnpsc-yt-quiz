<!DOCTYPE html>
<html lang="ta">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>LOVE TNPSC - Studio Quiz</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link href="https://fonts.googleapis.com/css2?family=Mukta+Malar:wght@600;700;800&family=Teko:wght@700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body, html {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background: #ffffff !important;
      font-family: 'Mukta Malar', sans-serif;
      color: #0b1536;
    }

    .main-wrapper {
      width: 100%;
      height: 100%;
      background: #ffffff;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 8px 16px;
      position: relative;
    }

    /* Top Navigation Bar */
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 5px;
      border-bottom: 1.5px solid #e2e8f0;
      gap: 8px;
      flex-shrink: 0;
    }

    .brand-tag {
      font-weight: 800;
      font-size: 13px;
      color: #1e3a8a;
      letter-spacing: 0.5px;
      white-space: nowrap;
    }

    /* கேள்வி எண் தேர்வு செய்யும் பட்டன் */
    .grid-trigger-btn {
      background: #f1f5f9;
      color: #0f172a;
      border: 1.5px solid #cbd5e1;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .nav-btn {
      background: #f1f5f9;
      color: #0f172a;
      border: 1px solid #cbd5e1;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .nav-btn:active {
      transform: scale(0.92);
      background: #e2e8f0;
    }

    .start-btn-top {
      background: linear-gradient(135deg, #1e3a8a, #0f172a);
      color: #ffffff;
      font-size: 13px;
      font-weight: 800;
      border: none;
      padding: 6px 14px;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
      white-space: nowrap;
    }
    .start-btn-top:disabled {
      opacity: 0.6;
    }

    .btn-edit {
      background: #f8fafc;
      color: #334155;
      border: 1px solid #cbd5e1;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
    }

    /* Question Title */
    .question-title {
      font-size: 21px;
      font-weight: 800;
      color: #0b1a78;
      line-height: 1.3;
      margin: 4px 0;
      flex-shrink: 0;
      cursor: pointer;
    }

    /* Middle Area */
    .body-content {
      display: flex;
      flex: 1;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin: 2px 0;
      overflow: hidden;
      position: relative;
    }

    /* Options */
    .options-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex: 1.2;
      justify-content: center;
    }

    .opt-box {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 18px;
      font-weight: 800;
      color: #000000;
      padding: 5px 12px;
      border-radius: 6px;
      transition: all 0.2s ease;
    }

    .opt-char {
      color: #000000;
      font-weight: 800;
      width: 24px;
    }

    .opt-box.is-correct {
      background-color: #10b981 !important;
      color: #ffffff !important;
      box-shadow: 0 3px 10px rgba(16, 185, 129, 0.4);
    }
    .opt-box.is-correct span {
      color: #ffffff !important;
    }

    .tick-badge {
      margin-left: auto;
      background: #ffffff;
      color: #059669;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 900;
      animation: popTick 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    @keyframes popTick {
      0% { transform: scale(0); }
      100% { transform: scale(1); }
    }

    /* Right Side Black Silhouette Container */
    .right-column {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      height: 100%;
      max-height: 220px;
    }

    .vector-art-box {
      width: 100%;
      max-width: 260px;
      height: 190px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f8fafc;
      border: 2px dashed #cbd5e1;
      border-radius: 12px;
      padding: 10px;
    }

    .vector-art-box svg {
      width: 100%;
      height: 100%;
      fill: #0f172a;
    }

    /* Golden 5s Timer */
    .gold-timer {
      position: absolute;
      bottom: -4px;
      right: -4px;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #fef08a, #ca8a04 60%, #713f12 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 3px 10px rgba(161, 98, 7, 0.4);
      border: 2px solid #fef9c3;
    }

    .timer-num {
      font-family: 'Teko', sans-serif;
      font-size: 34px;
      font-weight: 700;
      color: #ffffff;
      line-height: 1;
      text-shadow: 0 2px 4px rgba(0,0,0,0.5);
    }

    /* கடைசி கேள்விக்கான கமெண்ட் பேனர் */
    .comment-banner {
      display: none;
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, 0.92);
      backdrop-filter: blur(4px);
      border-radius: 14px;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 12px;
      z-index: 20;
      animation: popComment 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
      padding: 16px;
      text-align: center;
    }

    @keyframes popComment {
      0% { transform: scale(0.8); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    .comment-text-main {
      font-size: 24px;
      font-weight: 800;
      color: #facc15;
      text-shadow: 0 2px 8px rgba(0,0,0,0.4);
    }

    .comment-text-sub {
      font-size: 16px;
      font-weight: 700;
      color: #ffffff;
    }

    /* வினா எண் கட்டத் திரை (Question Grid Modal) */
    .grid-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.7);
      backdrop-filter: blur(4px);
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 12px;
    }
    .grid-content {
      background: #ffffff;
      border-radius: 14px;
      padding: 16px;
      width: 100%;
      max-width: 600px;
      max-height: 85vh;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.25);
    }
    .tiles-wrapper {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(44px, 1fr));
      gap: 8px;
      overflow-y: auto;
      max-height: 60vh;
      padding: 4px;
    }
    .tile-btn {
      background: #f1f5f9;
      color: #0f172a;
      border: 1.5px solid #cbd5e1;
      padding: 8px 0;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      text-align: center;
    }
    .tile-btn.current {
      background: #1e3a8a;
      color: #ffffff;
      border-color: #1e3a8a;
    }

    /* அப்லோட் மாடல் */
    .modal-wrap {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      align-items: center;
      justify-content: center;
      z-index: 100;
    }
    .modal-card {
      background: #ffffff;
      border-radius: 12px;
      padding: 16px;
      width: 90%;
      max-width: 500px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .modal-card textarea {
      width: 100%;
      height: 160px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      padding: 8px;
      font-size: 12px;
      font-family: monospace;
    }
  </style>
</head>
<body>

  <div class="main-wrapper">

    <!-- Top Navigation Bar -->
    <div class="header-bar">
      <div style="display: flex; align-items: center; gap: 6px;">
        <span class="brand-tag">LOVE TNPSC</span>
        <!-- நேரடியாக கேள்வி எண் தேர்வு செய்யும் பட்டன் -->
        <button id="gridBtn" class="grid-trigger-btn" onclick="openGridModal()">
          <span>🔢 வினா</span>
          <span id="qBadgeNum" class="text-indigo-900 font-black">01/52</span>
          <span>▼</span>
        </button>
      </div>

      <!-- முன்னாடி / பின்னாடி செல்லும் பட்டன்கள் -->
      <div style="display: flex; align-items: center; gap: 4px;">
        <button class="nav-btn" onclick="prevQuestion()" title="முந்தைய கேள்வி">◀ பின்</button>
        <button class="nav-btn" onclick="nextQuestion()" title="அடுத்த கேள்வி">முன் ▶</button>
      </div>
      
      <button id="startBtn" class="start-btn-top" onclick="startTimer()">
        ⏱️ தொடங்கு (5s)
      </button>

      <button class="btn-edit" onclick="openEditor()">➕ கேள்விகள்</button>
    </div>

    <!-- Question Line (இதைத் தொட்டாலும் கட்டத் திரை திறக்கும்) -->
    <h1 id="qText" class="question-title" onclick="openGridModal()" title="கேள்வி எண் மாற்ற இங்கே கிளிக் செய்யவும்"></h1>

    <!-- Options and Visuals -->
    <div class="body-content">
      
      <div class="options-group">
        <div id="optRow0" class="opt-box">
          <span class="opt-char">a)</span>
          <span id="optText0"></span>
          <div id="tick0"></div>
        </div>
        <div id="optRow1" class="opt-box">
          <span class="opt-char">b)</span>
          <span id="optText1"></span>
          <div id="tick1"></div>
        </div>
        <div id="optRow2" class="opt-box">
          <span class="opt-char">c)</span>
          <span id="optText2"></span>
          <div id="tick2"></div>
        </div>
        <div id="optRow3" class="opt-box">
          <span class="opt-char">d)</span>
          <span id="optText3"></span>
          <div id="tick3"></div>
        </div>
      </div>

      <div class="right-column">
        <div id="vectorArtContainer" class="vector-art-box"></div>
        <div class="gold-timer">
          <span id="timerVal" class="timer-num">5</span>
        </div>
      </div>

      <!-- கடைசி கேள்விக்கு மட்டும் தோன்றும் கமெண்ட் பேனர் -->
      <div id="commentBanner" class="comment-banner">
        <div style="font-size: 38px;">💬</div>
        <div class="comment-text-main">இதற்கான சரியான விடை என்ன?</div>
        <div class="comment-text-sub">உங்க பதிலை உடனே கீழே Comment பண்ணுங்க! 👇</div>
      </div>

    </div>

  </div>

  <!-- வினா எண் கட்டங்கள் பாப்-அப் விண்டோ -->
  <div id="gridModal" class="grid-modal" onclick="closeGridModal(event)">
    <div class="grid-content" onclick="event.stopPropagation()">
      <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #e2e8f0; padding-bottom: 6px;">
        <h3 style="font-size: 15px; font-weight: 800; color: #0b1a78;">வினா எண்ணைத் தேர்ந்தெடுக்கவும்:</h3>
        <button style="border: none; background: none; font-size: 18px; font-weight: bold; cursor: pointer;" onclick="closeGridModal()">✕</button>
      </div>
      <div id="tilesContainer" class="tiles-wrapper"></div>
    </div>
  </div>

  <!-- Upload Modal -->
  <div id="editorModal" class="modal-wrap">
    <div class="modal-card">
      <h3 style="font-size: 15px; font-weight: 800; color: #0b1a78;">JSON குறியீட்டை ஒட்டவும்:</h3>
      <textarea id="jsonBox"></textarea>
      <div style="display: flex; gap: 8px; justify-content: flex-end;">
        <button style="padding: 6px 14px; border: none; background: #e2e8f0; border-radius: 6px; font-weight: 700; cursor: pointer;" onclick="closeEditor()">ரத்து</button>
        <button style="padding: 6px 14px; border: none; background: #10b981; color: #fff; border-radius: 6px; font-weight: 700; cursor: pointer;" onclick="saveQuestions()">சேமி & இயக்கு</button>
      </div>
    </div>
  </div>

  <script>
    const VECTOR_ICONS = {
      war: `<svg viewBox="0 0 200 160"><path d="M20,135 Q50,110 80,135 L90,135 L85,115 L105,95 L120,110 L115,135 L180,135 L170,120 L160,125 L150,105 L165,85 L145,75 L135,90 L125,80 L140,50 L120,45 L105,70 L95,65 L110,40 L90,35 L75,60 L60,55 L75,30 L55,25 L40,50 L20,135 Z M10,140 L190,140 L190,148 L10,148 Z M45,70 L65,50 M140,70 L120,50 M85,30 L95,15 L105,30 Z M50,110 L25,95 M150,110 L175,95"/></svg>`,
      gun: `<svg viewBox="0 0 200 160"><path d="M15,82 L80,78 L95,70 L175,68 L185,74 L145,82 L105,84 L95,98 L80,102 L75,90 L45,92 L20,105 L15,82 Z M100,85 L110,95 L118,92 L112,85 Z M170,62 L185,62 L185,66 L170,66 Z"/></svg>`,
      soldier: `<svg viewBox="0 0 200 160"><circle cx="100" cy="38" r="18"/><path d="M80,62 C70,65 60,78 60,95 L65,145 L85,145 L85,110 L115,110 L115,145 L135,145 L140,95 C140,78 130,65 120,62 Z M82,24 L118,24 L112,14 L88,14 Z M52,85 L42,125 L54,128 L62,95 Z M148,85 L158,125 L146,128 L138,95 Z"/></svg>`,
      queen: `<svg viewBox="0 0 200 160"><circle cx="100" cy="35" r="16"/><path d="M85,18 L100,5 L115,18 L108,22 L92,22 Z M75,56 C65,65 62,80 62,100 L55,145 L145,145 L138,100 C138,80 135,65 125,56 Z M142,65 L175,25 L182,32 L150,75 Z M58,65 L45,95 L55,98 L65,72 Z"/></svg>`,
      king: `<svg viewBox="0 0 200 160"><path d="M40,140 L160,140 L155,90 L165,90 L165,70 L150,70 L150,50 L135,50 L135,70 L115,70 L115,40 L85,40 L85,70 L65,70 L65,50 L50,50 L50,70 L35,70 L35,90 L45,90 Z M90,95 L110,95 L110,125 L90,125 Z M60,95 L75,95 L75,115 L60,115 Z M125,95 L140,95 L140,115 L125,115 Z"/></svg>`,
      law: `<svg viewBox="0 0 200 160"><path d="M55,20 L135,20 C145,20 150,25 150,35 L150,130 C150,140 145,145 135,145 L55,145 C45,145 40,140 40,130 L40,35 C40,25 45,20 55,20 Z M60,45 L130,45 L130,52 L60,52 Z M60,65 L130,65 L130,72 L60,72 Z M60,85 L130,85 L130,92 L60,92 Z M60,105 L110,105 L110,112 L60,112 Z M120,115 A12,12 0 1,0 144,115 A12,12 0 1,0 120,115 Z"/></svg>`
    };

    function getSilhouetteForQuestion(text) {
      const q = text.toLowerCase();
      if (q.includes("துப்பாக்கி") || q.includes("தோட்டா") || q.includes("என்பீல்டு")) return VECTOR_ICONS.gun;
      if (q.includes("லட்சுமி பாய்") || q.includes("ராணி") || q.includes("பேகம்") || q.includes("மங்கை")) return VECTOR_ICONS.queen;
      if (q.includes("போர்") || q.includes("கலகம்") || q.includes("மீரட்") || q.includes("வந்தவாசி") || q.includes("புரட்சி")) return VECTOR_ICONS.war;
      if (q.includes("பகதூர் ஷா") || q.includes("பேரரசர்") || q.includes("நவாப்") || q.includes("அரசர்")) return VECTOR_ICONS.king;
      if (q.includes("உடன்படிக்கை") || q.includes("சட்டம்") || q.includes("கொள்கை") || q.includes("அறிக்கை")) return VECTOR_ICONS.law;
      return VECTOR_ICONS.soldier;
    }

    let defaultQuizData = [
      {"question": "Q) முதலாம் கர்நாடகப் போர் நடைபெற்ற காலகட்டம் எது?", "options": ["1740 - 1748", "1746 - 1748", "1748 - 1754", "1756 - 1763"], "correct": 1},
      {"question": "Q) முதலாம் கர்நாடகப் போருக்கு உடனடிக் காரணமாக அமைந்த ஐரோப்பியப் போர் எது?", "options": ["ஆஸ்திரிய வாரிசுரிமைப் போர்", "ஏழாண்டுப் போர்", "ஸ்பெயின் வாரிசுரிமைப் போர்", "ரோமானியப் போர்"], "correct": 0},
      {"question": "Q) முதலாம் கர்நாடகப் போரின் போது பிரெஞ்சு பாண்டிச்சேரி ஆளுநராக இருந்தவர் யார்?", "options": ["கவுண்ட்-டி-லாலி", "ராபர்ட் கிளைவ்", "டியூப்ளே", "லா போர்டோனைஸ்"], "correct": 2},
      {"question": "Q) சாந்தோம் போர் (அடையாறு போர்) நடைபெற்ற ஆண்டு எது?", "options": ["1748", "1750", "1744", "1746"], "correct": 3},
      {"question": "Q) அடையாறு போரில் அன்வாருதீனின் படையை வழிநடத்திய அவரது மகன் யார்?", "options": ["முகமது அலி", "சந்தா சாகிப்", "முசாபர் ஜங்", "மாபூஸ்கான்"], "correct": 3},
      {"question": "Q) அடையாறு போரில் மாபூஸ்கானைத் தோற்கடித்த பிரெஞ்சுப் படைத்தளபதி யார்?", "options": ["கேப்டன் பாரடைஸ்", "லாலி", "புஸ்ஸி", "பெயர்"], "correct": 0},

      {"question": "Q) இந்தியாவில் பிரெஞ்சு ஆதிக்கத்தின் அரசியல் கனவை நிரந்தரமாக முடிவுக்குக் கொண்டுவந்த போர் எது?", "options": ["அடையாறு போர்", "வந்தவாசிப் போர் (1760)", "ஆம்பூர் போர்", "பிளாசிப் போர்"], "correct": 1},
      {"question": "Q) பிரான்ஸ் திரும்பிய கவுண்ட்-டி-லாலி எங்கு வைத்து தூக்கிலிடப்பட்டார்?", "options": ["லண்டன் டவர்", "பாஸ்டில் சிறை (பாரிஸ்)", "பாண்டிச்சேரி", "ரோம்"], "correct": 1},
      {"question": "Q) 'இந்திய இராணுவத்தின் தந்தை' என்று அழைக்கப்படும் ஆங்கிலேய தளபதி யார்?", "options": ["ராபர்ட் கிளைவ்", "சர் அயர்கூட்", "மேஜர் ஸ்ட்ரிங்கர் லாரன்ஸ்", "வாரன் ஹேஸ்டிங்ஸ்"], "correct": 2},
      {"question": "Q) கர்நாடகப் போர்களின் விளைவாக இந்தியாவில் ஆங்கிலேயரின் அதிகாரம் வலுவடைய முக்கியக் காரணம் என்ன?", "options": ["கடற்படை வலிமை மற்றும் நிதி மேன்மை", "இந்திய மக்களின் ஆதரவு", "மராத்தியரின் கூட்டணி", "பிரெஞ்சு மன்னரின் துரோகம்"], "correct": 0},
      {"question": "Q) டியூப்ளேயின் அரசியல் ராஜதந்திரங்களுக்குப் பாலமாக இருந்த அவரது புகழ்பெற்ற தலைமைத் துவிபாஷி யார்?", "options": ["பச்சைப்ப முதலியார்", "ஆனந்தரங்கம் பிள்ளை", "ராமலிங்க அடிகளார்", "அழகப்ப செட்டியார்"], "correct": 1},
      {"question": "Q) முதலாம், இரண்டாம் மற்றும் மூன்றாம் கர்நாடகப் போர்களை முடிவுக்குக் கொண்டுவந்த உடன்படிக்கைகளின் சரியான வரிசை எது?", "options": ["ஐக்ஸ்-லா-சாப்பல், பாண்டிச்சேரி, பாரிஸ்", "பாண்டிச்சேரி, ஐக்ஸ்-லா-சாப்பல், பாரிஸ்", "பாரிஸ், பாண்டிச்சேரி, ஐக்ஸ்-லா-சாப்பல்", "ஐக்ஸ்-லா-சாப்பல், பாரிஸ், பாண்டிச்சேரி"], "correct": 0}
    ];

    let quizData = JSON.parse(localStorage.getItem('quizData_saved')) || defaultQuizData;
    let currentIndex = parseInt(localStorage.getItem('quiz_last_index')) || 0;
    if (currentIndex >= quizData.length) currentIndex = 0;

    let timerRunning = false;
    let countdown = 5;
    let timerHandle = null;

    let audioCtx = null;
    function getCtx() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      return audioCtx;
    }

    function playTick() {
      try {
        const ctx = getCtx();
        const now = ctx.currentTime;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(850, now);
        osc.frequency.exponentialRampToValueAtTime(150, now + 0.04);
        gain.gain.setValueAtTime(0.35, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.04);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + 0.04);
      } catch (e) {}
    }

    function playDing() {
      try {
        const ctx = getCtx();
        const now = ctx.currentTime;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(880, now);
        osc.frequency.exponentialRampToValueAtTime(1046, now + 0.08);
        gain.gain.setValueAtTime(0.08, now);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.4);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + 0.4);
      } catch (e) {}
    }

    function renderScreen() {
      clearInterval(timerHandle);
      timerRunning = false;
      countdown = 5;

      localStorage.setItem('quiz_last_index', currentIndex);

      const q = quizData[currentIndex];
      document.getElementById('qBadgeNum').textContent = `${String(currentIndex + 1).padStart(2, '0')}/${String(quizData.length).padStart(2, '0')}`;
      document.getElementById('qText').textContent = q.question;
      
      const artContainer = document.getElementById('vectorArtContainer');
      artContainer.innerHTML = getSilhouetteForQuestion(q.question);

      document.getElementById('timerVal').textContent = '5';

      // கமெண்ட் பேனரை மறைத்தல்
      document.getElementById('commentBanner').style.display = 'none';

      const btn = document.getElementById('startBtn');
      btn.disabled = false;
      btn.textContent = '⏱️ தொடங்கு (5s)';

      for (let i = 0; i < 4; i++) {
        document.getElementById(`optText${i}`).textContent = q.options[i];
        document.getElementById(`optRow${i}`).className = 'opt-box';
        document.getElementById(`tick${i}`).innerHTML = '';
      }
    }

    function nextQuestion() {
      if (currentIndex < quizData.length - 1) {
        currentIndex++;
        renderScreen();
      }
    }

    function prevQuestion() {
      if (currentIndex > 0) {
        currentIndex--;
        renderScreen();
      }
    }

    function startTimer() {
      getCtx();
      if (timerRunning) return;
      timerRunning = true;
      countdown = 5;

      const btn = document.getElementById('startBtn');
      btn.disabled = true;
      btn.textContent = 'ஓடுகிறது...';

      playTick();
      document.getElementById('timerVal').textContent = countdown;

      timerHandle = setInterval(() => {
        countdown--;
        if (countdown > 0) {
          playTick();
          document.getElementById('timerVal').textContent = countdown;
        } else {
          clearInterval(timerHandle);
          document.getElementById('timerVal').textContent = '0';
          revealAnswer();
        }
      }, 1000);
    }

    function revealAnswer() {
      playDing();
      const q = quizData[currentIndex];
      const isLastQuestion = (currentIndex === quizData.length - 1);

      // கடைசி கேள்வியாக இருந்தால் விடையைக் காட்டாமல் கமெண்ட் பேனரை மட்டும் காட்டு
      if (isLastQuestion) {
        document.getElementById('commentBanner').style.display = 'flex';
        document.getElementById('startBtn').textContent = 'கமெண்ட் பண்ணுங்க!';
        return;
      }

      // மற்ற வினாக்களுக்கு வழக்கம்போல பச்சை ஹைலைட்
      const correctIdx = q.correct;
      const row = document.getElementById(`optRow${correctIdx}`);
      row.classList.add('is-correct');
      document.getElementById(`tick${correctIdx}`).innerHTML = '<span class="tick-badge">✔</span>';

      document.getElementById('startBtn').textContent = 'சரியான விடை!';
      // ஆட்டோமேட்டிக் நெக்ஸ்ட் நீக்கப்பட்டுவிட்டது; நீங்கள் பட்டனைத் தட்டினால் மட்டுமே அடுத்த கேள்விக்குச் செல்லும்
    }

    /* வினா எண் கட்டங்கள் மேலாண்மை */
    function openGridModal() {
      const container = document.getElementById('tilesContainer');
      container.innerHTML = '';
      quizData.forEach((_, idx) => {
        const btn = document.createElement('button');
        btn.className = `tile-btn ${idx === currentIndex ? 'current' : ''}`;
        btn.textContent = idx + 1;
        btn.onclick = () => {
          currentIndex = idx;
          renderScreen();
          closeGridModal();
        };
        container.appendChild(btn);
      });
      document.getElementById('gridModal').style.display = 'flex';
    }

    function closeGridModal(e) {
      if (!e || e.target.id === 'gridModal' || e.target.tagName === 'BUTTON') {
        document.getElementById('gridModal').style.display = 'none';
      }
    }

    function openEditor() {
      document.getElementById('jsonBox').value = JSON.stringify(quizData, null, 2);
      document.getElementById('editorModal').style.display = 'flex';
    }
    function closeEditor() {
      document.getElementById('editorModal').style.display = 'none';
    }
    function saveQuestions() {
      try {
        const parsed = JSON.parse(document.getElementById('jsonBox').value);
        if (Array.isArray(parsed) && parsed.length > 0) {
          quizData = parsed;
          localStorage.setItem('quizData_saved', JSON.stringify(quizData));
          currentIndex = 0;
          closeEditor();
          renderScreen();
        }
      } catch (e) {
        alert('JSON error!');
      }
    }

    window.onload = () => {
      renderScreen();
      document.body.addEventListener('touchstart', getCtx, { once: true });
      document.body.addEventListener('click', getCtx, { once: true });
    };
  </script>
</body>
