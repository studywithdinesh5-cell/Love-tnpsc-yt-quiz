<!DOCTYPE html>
<html lang="ta">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>LOVE TNPSC - Compact Studio Quiz</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link href="https://fonts.googleapis.com/css2?family=Mukta+Malar:wght@600;700;800&family=Teko:wght@700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body, html {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background: #ffffff !important;
      font-family: 'Mukta Malar', sans-serif;
      color: #0b1536;
    }

    .main-wrapper {
      width: 100%;
      height: 100%;
      background: #ffffff;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 8px 18px;
      position: relative;
    }

    /* Top Bar */
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 5px;
      border-bottom: 1.5px solid #e2e8f0;
      gap: 8px;
      flex-shrink: 0;
      z-index: 10;
    }

    .brand-tag {
      font-weight: 800;
      font-size: 13px;
      color: #1e3a8a;
      letter-spacing: 0.5px;
      white-space: nowrap;
    }

    .grid-trigger-btn {
      background: #f1f5f9;
      color: #0f172a;
      border: 1.5px solid #cbd5e1;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .nav-btn {
      background: #f1f5f9;
      color: #0f172a;
      border: 1px solid #cbd5e1;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .nav-btn:active {
      transform: scale(0.92);
      background: #e2e8f0;
    }

    /* பென்சில் பட்டன் */
    .pen-toggle-btn {
      background: #f8fafc;
      color: #0f172a;
      border: 1.5px solid #cbd5e1;
      padding: 4px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: all 0.2s ease;
    }
    .pen-toggle-btn.active {
      background: #ef4444 !important;
      color: #ffffff !important;
      border-color: #dc2626 !important;
      box-shadow: 0 0 10px rgba(239, 68, 68, 0.4);
    }

    .start-btn-top {
      background: linear-gradient(135deg, #1e3a8a, #0f172a);
      color: #ffffff;
      font-size: 13px;
      font-weight: 800;
      border: none;
      padding: 6px 14px;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
      white-space: nowrap;
    }
    .start-btn-top:disabled {
      opacity: 0.6;
    }

    .btn-edit {
      background: #f8fafc;
      color: #334155;
      border: 1px solid #cbd5e1;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
    }

    /* கேள்வி வரி - முன்பு இருந்த அதே கச்சிதமான அளவு */
    .question-title {
      font-size: 21px;
      font-weight: 800;
      color: #0b1a78;
      line-height: 1.3;
      margin: 4px 0;
      flex-shrink: 0;
      cursor: pointer;
      z-index: 5;
    }

    /* நடுப்பகுதி: இடது பக்கம் ஆப்ஷன்கள், வலது பக்கம் எழுதுவதற்கான காலி இடம் */
    .body-content {
      display: flex;
      flex: 1;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin: 2px 0;
      overflow: hidden;
      position: relative;
    }

    /* 4 ஆப்ஷன்கள் - முன்பு இருந்த அளவு */
    .options-group {
      display: flex;
      flex-direction: column;
      gap: 7px;
      flex: 1;
      max-width: 52%;
      justify-content: center;
      z-index: 5;
    }

    .opt-box {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 18px;
      font-weight: 800;
      color: #000000;
      padding: 5px 12px;
      border-radius: 6px;
      background: #ffffff;
      transition: all 0.2s ease;
    }

    .opt-char {
      color: #000000;
      font-weight: 800;
      width: 24px;
    }

    .opt-box.is-correct {
      background-color: #10b981 !important;
      color: #ffffff !important;
      box-shadow: 0 3px 10px rgba(16, 185, 129, 0.4);
    }
    .opt-box.is-correct span {
      color: #ffffff !important;
    }

    .tick-badge {
      margin-left: auto;
      background: #ffffff;
      color: #059669;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 900;
      animation: popTick 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    @keyframes popTick {
      0% { transform: scale(0); }
      100% { transform: scale(1); }
    }

    /* வலதுபுற காலி இடம் (படம் நீக்கப்பட்டு தாராளமாக எழுத ஒதுக்கப்பட்ட இடம்) */
    .free-writing-space {
      flex: 1;
      height: 100%;
      position: relative;
    }

    /* தங்க நிற வட்ட டைமர் (வலது கீழ் மூலையில்) */
    .gold-timer {
      position: absolute;
      bottom: -4px;
      right: -4px;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #fef08a, #ca8a04 60%, #713f12 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 3px 10px rgba(161, 98, 7, 0.4);
      border: 2px solid #fef9c3;
      z-index: 10;
    }

    .timer-num {
      font-family: 'Teko', sans-serif;
      font-size: 34px;
      font-weight: 700;
      color: #ffffff;
      line-height: 1;
      text-shadow: 0 2px 4px rgba(0,0,0,0.5);
    }

    /* முழுத்திரை வரைபலகை (Drawing Layer) */
    #drawingCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 15;
      pointer-events: none;
      touch-action: none;
    }
    #drawingCanvas.pen-active {
      pointer-events: auto;
      cursor: crosshair;
    }

    /* பென்சில் டூல்பார் */
    .pen-palette {
      display: none;
      position: absolute;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      background: #0f172a;
      padding: 5px 14px;
      border-radius: 30px;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.25);
      z-index: 25;
      animation: slideUp 0.2s ease-out;
    }

    @keyframes slideUp {
      0% { transform: translate(-50%, 15px); opacity: 0; }
      100% { transform: translate(-50%, 0); opacity: 1; }
    }

    .color-dot {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      cursor: pointer;
      border: 2px solid #ffffff;
      transition: transform 0.15s ease;
    }
    .color-dot.selected {
      transform: scale(1.25);
      border-color: #facc15;
    }

    .pen-action-btn {
      background: rgba(255,255,255,0.2);
      color: #ffffff;
      border: none;
      padding: 4px 8px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 800;
      cursor: pointer;
    }

    /* கடைசி கேள்வி கமெண்ட் பேனர் */
    .comment-banner {
      display: none;
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, 0.94);
      backdrop-filter: blur(4px);
      border-radius: 14px;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 12px;
      z-index: 20;
      animation: popComment 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
      padding: 16px;
      text-align: center;
    }

    @keyframes popComment {
      0% { transform: scale(0.8); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    .comment-text-main {
      font-size: 24px;
      font-weight: 800;
      color: #facc15;
    }

    .comment-text-sub {
      font-size: 16px;
      font-weight: 700;
      color: #ffffff;
    }

    /* வினா எண் கட்டங்கள் விண்டோ */
    .grid-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.7);
      backdrop-filter: blur(4px);
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 12px;
    }
    .grid-content {
      background: #ffffff;
      border-radius: 14px;
      padding: 16px;
      width: 100%;
      max-width: 600px;
      max-height: 85vh;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.25);
    }
    .tiles-wrapper {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(44px, 1fr));
      gap: 8px;
      overflow-y: auto;
      max-height: 60vh;
      padding: 4px;
    }
    .tile-btn {
      background: #f1f5f9;
      color: #0f172a;
      border: 1.5px solid #cbd5e1;
      padding: 8px 0;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      text-align: center;
    }
    .tile-btn.current {
      background: #1e3a8a;
      color: #ffffff;
      border-color: #1e3a8a;
    }

    /* அப்லோட் மாடல் */
    .modal-wrap {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      align-items: center;
      justify-content: center;
      z-index: 100;
    }
    .modal-card {
      background: #ffffff;
      border-radius: 12px;
      padding: 16px;
      width: 90%;
      max-width: 500px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .modal-card textarea {
      width: 100%;
      height: 160px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      padding: 8px;
      font-size: 12px;
      font-family: monospace;
    }
  </style>
</head>
<body>

  <div class="main-wrapper">

    <!-- Header Bar -->
    <div class="header-bar">
      <div style="display: flex; align-items: center; gap: 6px;">
        <span class="brand-tag">LOVE TNPSC</span>
        <button id="gridBtn" class="grid-trigger-btn" onclick="openGridModal()">
          <span>🔢 வினா</span>
          <span id="qBadgeNum" class="text-indigo-900 font-black">01/50</span>
          <span>▼</span>
        </button>
      </div>

      <div style="display: flex; align-items: center; gap: 5px;">
        <button class="nav-btn" onclick="prevQuestion()" title="முந்தைய கேள்வி">◀ பின்</button>
        <button class="nav-btn" onclick="nextQuestion()" title="அடுத்த கேள்வி">முன் ▶</button>
        
        <!-- பென்சில் பட்டன் -->
        <button id="penToggleBtn" class="pen-toggle-btn" onclick="togglePenMode()">
          <span>✏️</span>
          <span id="penBtnText">எழுது</span>
        </button>
      </div>
      
      <button id="startBtn" class="start-btn-top" onclick="startTimer()">
        ⏱️ தொடங்கு (5s)
      </button>

      <button class="btn-edit" onclick="openEditor()">➕ கேள்விகள்</button>
    </div>

    <!-- Question Line -->
    <h1 id="qText" class="question-title" onclick="openGridModal()" title="வினா எண் மாற்ற கிளிக் செய்யவும்"></h1>

    <!-- Body: Left Options + Right Blank Writing Area -->
    <div class="body-content">
      
      <!-- Left Options -->
      <div class="options-group">
        <div id="optRow0" class="opt-box">
          <span class="opt-char">a)</span>
          <span id="optText0"></span>
          <div id="tick0"></div>
        </div>
        <div id="optRow1" class="opt-box">
          <span class="opt-char">b)</span>
          <span id="optText1"></span>
          <div id="tick1"></div>
        </div>
        <div id="optRow2" class="opt-box">
          <span class="opt-char">c)</span>
          <span id="optText2"></span>
          <div id="tick2"></div>
        </div>
        <div id="optRow3" class="opt-box">
          <span class="opt-char">d)</span>
          <span id="optText3"></span>
          <div id="tick3"></div>
        </div>
      </div>

      <!-- Right Blank Writing Area -->
      <div class="free-writing-space">
        <div class="gold-timer">
          <span id="timerVal" class="timer-num">5</span>
        </div>
      </div>

      <!-- Comment Banner for Last Question -->
      <div id="commentBanner" class="comment-banner">
        <div style="font-size: 38px;">💬</div>
        <div class="comment-text-main">இதற்கான சரியான விடை என்ன?</div>
        <div class="comment-text-sub">உங்க பதிலை உடனே கீழே Comment பண்ணுங்க! 👇</div>
      </div>

    </div>

    <!-- Full Screen Touch Drawing Canvas -->
    <canvas id="drawingCanvas"></canvas>

    <!-- Floating Pen Toolbar -->
    <div id="penPalette" class="pen-palette" style="display: none;">
      <div class="color-dot selected" style="background: #ef4444;" onclick="setPenColor('#ef4444', this)" title="சிவப்பு"></div>
      <div class="color-dot" style="background: #eab308;" onclick="setPenColor('#eab308', this)" title="மஞ்சள்"></div>
      <div class="color-dot" style="background: #10b981;" onclick="setPenColor('#10b981', this)" title="பச்சை"></div>
      <div class="color-dot" style="background: #2563eb;" onclick="setPenColor('#2563eb', this)" title="நீலம்"></div>
      
      <button class="pen-action-btn" onclick="clearCanvas()">🗑️ அழி</button>
      <button class="pen-action-btn" style="background: #ef4444;" onclick="togglePenMode()">✕ மூடு</button>
    </div>

  </div>

  <!-- Grid Modal -->
  <div id="gridModal" class="grid-modal" onclick="closeGridModal(event)">
    <div class="grid-content" onclick="event.stopPropagation()">
      <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #e2e8f0; padding-bottom: 6px;">
        <h3 style="font-size: 15px; font-weight: 800; color: #0b1a78;">வினா எண்ணைத் தேர்ந்தெடுக்கவும்:</h3>
        <button style="border: none; background: none; font-size: 18px; font-weight: bold; cursor: pointer;" onclick="closeGridModal()">✕</button>
      </div>
      <div id="tilesContainer" class="tiles-wrapper"></div>
    </div>
  </div>

  <!-- Upload Modal -->
  <div id="editorModal" class="modal-wrap">
    <div class="modal-card">
      <h3 style="font-size: 15px; font-weight: 800; color: #0b1a78;">JSON குறியீட்டை ஒட்டவும்:</h3>
      <textarea id="jsonBox"></textarea>
      <div style="display: flex; gap: 8px; justify-content: flex-end;">
        <button style="padding: 6px 14px; border: none; background: #e2e8f0; border-radius: 6px; font-weight: 700; cursor: pointer;" onclick="closeEditor()">ரத்து</button>
        <button style="padding: 6px 14px; border: none; background: #10b981; color: #fff; border-radius: 6px; font-weight: 700; cursor: pointer;" onclick="saveQuestions()">சேமி & இயக்கு</button>
      </div>
    </div>
  </div>

  <script>
    let defaultQuizData = [
      {"question": "Q) 'ஆடு' - எவ்வகை தொழிற்பெயர்?", "options": ["விகுதி பெற்ற தொழிற்பெயர்", "முதboxநிலை தொழிற்பெயர்", "முதboxநிலை திரிந்த தொழிற்பெயர்", "எதிர்மறை தொழிற்பெயர்"], "correct": 1},
      {"question": "Q) 'கேடு' - எவ்வகை தொழிற்பெயர்?", "options": ["முதboxநிலை திரிந்த தொழிற்பெயர்", "முதboxநிலை தொழிற்பெயர்", "விகுதி பெற்ற தொழிற்பெயர்", "தொழிலாகுபெயர்"], "correct": 0},
      {"question": "Q) 'அஃறிணை' - பிரித்தெழுதுக:", "options": ["அல் + திணை", "அஃது + திணை", "அல் + இணை", "அஃகு + திணை"], "correct": 0},
      {"question": "Q) 'பொருந்தாச் சொல் தேர்க' (சாரியையற்ற சொல்):", "options": ["மரத்தை", "புளியங்காய்", "வண்டொடு", "பாடினான்"], "correct": 3},
      {"question": "Q) 'வஞ்சியடி' என்பது எத்தனை சீர்களைப் பெற்று வரும்?", "options": ["இரு சீர்", "முச்சீர்", "நாற்சீர்", "ஐஞ்சீர்"], "correct": 0}
    ];

    let quizData = JSON.parse(localStorage.getItem('quizData_saved')) || defaultQuizData;
    let currentIndex = parseInt(localStorage.getItem('quiz_last_index')) || 0;
    if (currentIndex >= quizData.length) currentIndex = 0;

    let timerRunning = false;
    let countdown = 5;
    let timerHandle = null;

    let audioCtx = null;
    function getCtx() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      return audioCtx;
    }

    function playTick() {
      try {
        const ctx = getCtx();
        const now = ctx.currentTime;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(850, now);
        osc.frequency.exponentialRampToValueAtTime(150, now + 0.04);
        gain.gain.setValueAtTime(0.35, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.04);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + 0.04);
      } catch (e) {}
    }

    function playDing() {
      try {
        const ctx = getCtx();
        const now = ctx.currentTime;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(880, now);
        osc.frequency.exponentialRampToValueAtTime(1046, now + 0.08);
        gain.gain.setValueAtTime(0.08, now);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.4);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + 0.4);
      } catch (e) {}
    }

    function renderScreen() {
      clearInterval(timerHandle);
      timerRunning = false;
      countdown = 5;

      localStorage.setItem('quiz_last_index', currentIndex);

      const q = quizData[currentIndex];
      document.getElementById('qBadgeNum').textContent = `${String(currentIndex + 1).padStart(2, '0')}/${String(quizData.length).padStart(2, '0')}`;
      document.getElementById('qText').textContent = q.question;
      document.getElementById('timerVal').textContent = '5';
      document.getElementById('commentBanner').style.display = 'none';

      const btn = document.getElementById('startBtn');
      btn.disabled = false;
      btn.textContent = '⏱️ தொடங்கு (5s)';

      for (let i = 0; i < 4; i++) {
        document.getElementById(`optText${i}`).textContent = q.options[i];
        document.getElementById(`optRow${i}`).className = 'opt-box';
        document.getElementById(`tick${i}`).innerHTML = '';
      }

      clearCanvas();
    }

    function nextQuestion() {
      if (currentIndex < quizData.length - 1) {
        currentIndex++;
        renderScreen();
      }
    }

    function prevQuestion() {
      if (currentIndex > 0) {
        currentIndex--;
        renderScreen();
      }
    }

    function startTimer() {
      getCtx();
      if (timerRunning) return;
      timerRunning = true;
      countdown = 5;

      const btn = document.getElementById('startBtn');
      btn.disabled = true;
      btn.textContent = 'ஓடுகிறது...';

      playTick();
      document.getElementById('timerVal').textContent = countdown;

      timerHandle = setInterval(() => {
        countdown--;
        if (countdown > 0) {
          playTick();
          document.getElementById('timerVal').textContent = countdown;
        } else {
          clearInterval(timerHandle);
          document.getElementById('timerVal').textContent = '0';
          revealAnswer();
        }
      }, 1000);
    }

    function revealAnswer() {
      playDing();
      const q = quizData[currentIndex];
      const isLastQuestion = (currentIndex === quizData.length - 1);

      if (isLastQuestion) {
        document.getElementById('commentBanner').style.display = 'flex';
        document.getElementById('startBtn').textContent = 'கமெண்ட் பண்ணுங்க!';
        return;
      }

      const correctIdx = q.correct;
      const row = document.getElementById(`optRow${correctIdx}`);
      row.classList.add('is-correct');
      document.getElementById(`tick${correctIdx}`).innerHTML = '<span class="tick-badge">✔</span>';
      document.getElementById('startBtn').textContent = 'சரியான விடை!';
    }

    /* Pen Engine */
    const canvas = document.getElementById('drawingCanvas');
    const ctx = canvas.getContext('2d');
    let isDrawing = false;
    let penActive = false;
    let penColor = '#ef4444';
    let penSize = 3.5;

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);

    function togglePenMode() {
      penActive = !penActive;
      const penBtn = document.getElementById('penToggleBtn');
      const penText = document.getElementById('penBtnText');
      const palette = document.getElementById('penPalette');

      if (penActive) {
        canvas.classList.add('pen-active');
        penBtn.classList.add('active');
        penText.textContent = 'எழுதுகிறது...';
        palette.style.display = 'flex';
      } else {
        canvas.classList.remove('pen-active');
        penBtn.classList.remove('active');
        penText.textContent = 'எழுது';
        palette.style.display = 'none';
      }
    }

    function setPenColor(color, el) {
      penColor = color;
      document.querySelectorAll('.color-dot').forEach(d => d.classList.remove('selected'));
      el.classList.add('selected');
    }

    function clearCanvas() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
    }

    function getPos(e) {
      return {
        x: e.clientX || (e.touches && e.touches[0].clientX),
        y: e.clientY || (e.touches && e.touches[0].clientY)
      };
    }

    function startDraw(e) {
      if (!penActive) return;
      isDrawing = true;
      const pos = getPos(e);
      ctx.beginPath();
      ctx.moveTo(pos.x, pos.y);
      ctx.strokeStyle = penColor;
      ctx.lineWidth = penSize;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
    }

    function draw(e) {
      if (!isDrawing || !penActive) return;
      e.preventDefault();
      const pos = getPos(e);
      ctx.lineTo(pos.x, pos.y);
      ctx.stroke();
    }

    function stopDraw() {
      if (!penActive) return;
      isDrawing = false;
      ctx.closePath();
    }

    canvas.addEventListener('mousedown', startDraw);
    canvas.addEventListener('mousemove', draw);
    canvas.addEventListener('mouseup', stopDraw);

    canvas.addEventListener('touchstart', startDraw, { passive: false });
    canvas.addEventListener('touchmove', draw, { passive: false });
    canvas.addEventListener('touchend', stopDraw);

    /* Grid Modal */
    function openGridModal() {
      const container = document.getElementById('tilesContainer');
      container.innerHTML = '';
      quizData.forEach((_, idx) => {
        const btn = document.createElement('button');
        btn.className = `tile-btn ${idx === currentIndex ? 'current' : ''}`;
        btn.textContent = idx + 1;
        btn.onclick = () => {
          currentIndex = idx;
          renderScreen();
          closeGridModal();
        };
        container.appendChild(btn);
      });
      document.getElementById('gridModal').style.display = 'flex';
    }

    function closeGridModal(e) {
      if (!e || e.target.id === 'gridModal' || e.target.tagName === 'BUTTON') {
        document.getElementById('gridModal').style.display = 'none';
      }
    }

    function openEditor() {
      document.getElementById('jsonBox').value = JSON.stringify(quizData, null, 2);
      document.getElementById('editorModal').style.display = 'flex';
    }
    function closeEditor() {
      document.getElementById('editorModal').style.display = 'none';
    }
    function saveQuestions() {
      try {
        const parsed = JSON.parse(document.getElementById('jsonBox').value);
        if (Array.isArray(parsed) && parsed.length > 0) {
          quizData = parsed;
          localStorage.setItem('quizData_saved', JSON.stringify(quizData));
          currentIndex = 0;
          closeEditor();
          renderScreen();
        }
      } catch (e) {
        alert('JSON error!');
      }
    }

    window.onload = () => {
      resizeCanvas();
      renderScreen();
      document.body.addEventListener('touchstart', getCtx, { once: true });
      document.body.addEventListener('click', getCtx, { once: true });
    };
  </script>
</body>
</html>
